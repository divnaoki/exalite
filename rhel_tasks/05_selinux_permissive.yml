---
# =====================================================================
# 05_SELinux Permissive 設定
#
#   PHASE 1  変更前の設定情報を取得
#   PHASE 2  getenforce が Permissive でない場合のみ変更（冪等）
#   PHASE 3  変更後の設定情報を取得して確認
#
# getenforce（実際の動作モード）が Permissive でなければ、
# /etc/selinux/config の SELINUX= を permissive に書き換える。
#
# ansible.posix.selinux は「設定ファイルの書き換え（恒久設定）」と
# 「実行中モードの変更」を両方行う。setenforce だけでは再起動で戻ってしまうため、
# 恒久設定となる /etc/selinux/config の書き換えが必須。
#
# 【現在のモードによる違い】
#   Enforcing -> Permissive : config 書き換え + 即時反映（再起動不要）
#   Disabled  -> Permissive : 無効状態からは実行中モードを変更できないため
#                             再起動が必要（カーネルパラメータ selinux=0 も除去）
#
# 取得するのは getenforce と /etc/selinux/config の SELINUX= の2つだけ。
# 設定値は vars/05_selinux_permissive.yml で定義。
# =====================================================================
- name: "05_SELinux Permissive 設定"
  hosts: linux
  gather_facts: false
  become: true

  vars_files:
    - vars/05_selinux_permissive.yml

  tasks:
    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] SELinux の現在設定を取得"
      ansible.builtin.shell:
        cmd: |
          printf 'runtime:%s\n' "$(getenforce 2>/dev/null || echo unknown)"
          printf 'config:%s\n'  "$(grep -E '^SELINUX=' /etc/selinux/config 2>/dev/null | cut -d= -f2)"
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: selinux_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        selinux_before: >-
          {{ selinux_before | default({}) | combine({
               (item.split(':')[0]): (item.split(':')[1:] | join(':')) }) }}
      loop: "{{ selinux_before_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: "[BEFORE] 現在設定と指定値を表示"
      ansible.builtin.debug:
        msg:
          - "runtime (getenforce) : {{ selinux_before.runtime }} -> Permissive"
          - "config  (SELINUX=)   : {{ selinux_before.config | default('(なし)', true) }} -> {{ selinux_state }}"

    # =================================================================
    # PHASE 2: 変更（getenforce が Permissive でない場合のみ実行）
    # =================================================================
    # /etc/selinux/config の SELINUX= を permissive に書き換える（恒久設定）。
    # 併せて実行中モードも変更される（Disabled からの場合を除く）。
    # update_kernel_param は、カーネルパラメータに selinux=0 が付いている場合に
    # grubby で除去する。付いたままだと config を変えても無効のままになるため。
    - name: "/etc/selinux/config の SELINUX= を {{ selinux_state }} に書き換え"
      ansible.posix.selinux:
        state: "{{ selinux_state }}"
        policy: "{{ selinux_policy }}"
        update_kernel_param: "{{ selinux_update_kernel_param | bool }}"
      when: selinux_before.runtime != 'Permissive'
      register: selinux_set

    # Disabled -> Permissive は再起動しないと反映されない。
    - name: "再起動（現在 Disabled かつ selinux_allow_reboot が true のときのみ）"
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - selinux_before.runtime == 'Disabled'
        - selinux_allow_reboot | bool
        - not ansible_check_mode

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] SELinux の設定を再取得"
      ansible.builtin.shell:
        cmd: |
          printf 'runtime:%s\n' "$(getenforce 2>/dev/null || echo unknown)"
          printf 'config:%s\n'  "$(grep -E '^SELINUX=' /etc/selinux/config 2>/dev/null | cut -d= -f2)"
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: selinux_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        selinux_after: >-
          {{ selinux_after | default({}) | combine({
               (item.split(':')[0]): (item.split(':')[1:] | join(':')) }) }}
      loop: "{{ selinux_after_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: "[AFTER] 変更後の設定を表示"
      ansible.builtin.debug:
        msg:
          - "runtime (getenforce) : {{ selinux_after.runtime }}"
          - "config  (SELINUX=)   : {{ selinux_after.config | default('(なし)', true) }}"

    # config（恒久設定）は必ず確認する。
    # runtime は「Disabled から再起動していない場合」だけ未反映を許容する。
    - name: "[AFTER] 設定値が反映されたことを確認"
      ansible.builtin.assert:
        that:
          - selinux_after.config == selinux_state
          - (selinux_after.runtime == 'Permissive') or (reboot_pending | bool)
        success_msg: >-
          SELinux を {{ selinux_state }} に設定しました
          (config={{ selinux_after.config }} / runtime={{ selinux_after.runtime }})。
        fail_msg: >-
          設定値が一致しません
          (config={{ selinux_after.config }} / 期待={{ selinux_state }} /
           runtime={{ selinux_after.runtime }} / 期待=Permissive)。
      vars:
        reboot_pending: >-
          {{ (selinux_before.runtime == 'Disabled') and (not (selinux_allow_reboot | bool)) }}
      when: not ansible_check_mode

    - name: "[AFTER] 再起動が必要な場合は警告する"
      ansible.builtin.debug:
        msg: >-
          !!! 要再起動 !!! config は {{ selinux_after.config }} に書き換えましたが、
          現在の runtime は {{ selinux_after.runtime }} です。
          SELinux が無効の状態からは実行中モードを変更できないため、
          再起動後に Permissive になります
          （selinux_allow_reboot: true で Playbook 内から再起動できます）。
      when:
        - not ansible_check_mode
        - selinux_after.runtime != 'Permissive'
