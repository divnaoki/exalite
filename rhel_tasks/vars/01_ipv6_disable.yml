# =====================================================================
# 01_IPv6 無効化 : 変数定義
#
# パラメータシートの対応:
#   IPv6 -> False（＝ IPv6 を無効化する）
#
# 無効化は接続単位（nmcli の ipv6.method disabled）だけで行う。
# これでリンクローカル（fe80::）も含めて対象接続から IPv6 が消える。
# 手順書 docs/almalinux9_static_ip_ipv6_disable.md の「3-1」に相当。
# =====================================================================

# 無効化する nmcli の接続名
ipv6_connections:
  - "ens160"
