# =====================================================================
# 02_サービス起動設定 : 変数定義
#
# パラメータシートの対応:
#   chrony -> 自動起動 ON / 起動
#
# 対象サービスは systemd のユニット名（表示名ではない）で指定する。
# 導入済みであることが前提（パッケージのインストールは行わない）。
# =====================================================================

# 自動起動 ON + 起動するサービス
target_services:
  - "chronyd"
