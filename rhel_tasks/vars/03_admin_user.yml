# =====================================================================
# 03_管理者権限ユーザー作成 : 変数定義
#
# パラメータシートの対応:
#   管理者権限ユーザー -> mgAUTOXadm01
#
# 管理者権限は sudo 権限グループ（RHEL 系は wheel）への追加で与える。
# グループは追加のみ（append）。既存の所属は削除しない。
# =====================================================================

admin_users:
  - name: "mgAUTOXadm01"
    groups: ["wheel"]        # RHEL 系で sudo 権限を持つグループ
    shell: "/bin/bash"

# =====================================================================
# パスワード（機密情報）
#
# !!! 重要 !!! パスワードはこのファイルに書かないこと。
# admin_users にも書かない（ログに item が出力され平文が残るため）。
# Exastro の機密パラメータ、または extra-vars で渡す。
#
#   ansible-playbook 03_admin_user.yml \
#     -e '{"server_admin_accounts":{"mgAUTOXadm01":"＜パスワード＞"}}'
#
# 必要なのは「対象サーバーにユーザーが存在しない」場合のみ。
# 既存ユーザーのパスワードは変更しない（update_password: on_create）。
# 渡されていないまま新規作成が必要な場合は、1件も変更せずガードで中止する。
# =====================================================================
