# =====================================================================
# 04_時刻同期設定 : 変数定義
#
# パラメータシートの対応:
#   NTPサーバ -> 192.168.140.10
#
# RHEL 8 以降の時刻同期は chrony（chronyd）が標準。
# サービスの自動起動・起動は 02_service_startup.yml が担当し、
# 本 Playbook は同期先サーバーの設定だけを扱う。
# =====================================================================

# 同期先サーバー。複数指定する場合はリストに追加する。
#
# !!! 確認事項 !!! 192.168.140.10 は inventory の alma9（本 Playbook の実行対象）
# と同じ IP。自分自身を同期先に指定すると設定は入るが実際には同期できない
# （chronyc sources が Not synchronised のままになる）。
# 上位 NTP サーバーの IP が別にある場合はここを差し替えること。
ntp_servers:
  - "192.168.140.10"

# 各 server 行に付けるオプション。
#   iburst = 起動直後に短間隔で問い合わせて素早く同期する（RHEL 既定の書式）
ntp_server_options: "iburst"

# chrony の設定ファイルとサービス名（RHEL/AlmaLinux の既定値）
chrony_conf: "/etc/chrony.conf"
chrony_service: "chronyd"
