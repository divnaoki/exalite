---
# =====================================================================
# [収集] SELinux 設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# selinux_info として JSON で出力する。
#
#   selinux_info:
#     {"runtime": "Permissive",     getenforce の値（実際の動作モード）
#      "config": "permissive"}      /etc/selinux/config の SELINUX=（恒久設定）
#
# 設定は一切変更しない（読み取りのみ）。
# =====================================================================
- name: "05_SELinux設定情報収集"
  hosts: linux
  gather_facts: false
  become: true

  tasks:
    - name: SELinux設定情報取得（Before）
      ansible.builtin.shell:
        cmd: |
          printf 'runtime:%s\n' "$(getenforce 2>/dev/null || echo unknown)"
          printf 'config:%s\n'  "$(grep -E '^SELINUX=' /etc/selinux/config 2>/dev/null | cut -d= -f2)"
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: selinux_status_info

    - name: パラメータシート登録用形式設定
      set_fact:
        selinux_raw: >-
          {{ selinux_raw | default({}) | combine({
               (item.split(':')[0]): ((item.split(':')[1:] | join(':')) | default(none, true)) }) }}
      loop: "{{ selinux_status_info.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ selinux_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/selinux"
        block: |
          selinux_info: |
            {{ selinux_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
      become: false
