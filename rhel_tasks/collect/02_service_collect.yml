---
# =====================================================================
# [収集] (2) サービス起動設定 -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_service__<ホスト名>
# 対象サービスは設定側と同じ vars/02_service_startup.yml を読む。
# 設定は変更せず、現在値の取得のみを行う。
# =====================================================================
- name: "[収集] (2) サービス起動設定"
  hosts: linux
  gather_facts: false
  become: true

  vars_files:
    - vars/sections.yml
    - ../vars/02_service_startup.yml

  vars:
    sec: "{{ param_sections.service }}"
    sec_menu: "{{ param_section_menus.service | default(param_section_menu_default) }}"
    var_key: "collected_service__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"

  tasks:
    - name: "出力先ディレクトリを作成"
      ansible.builtin.file:
        path: "{{ collect_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    # 「ユニット名:is-enabled:is-active」の形で1行ずつ返す。
    - name: "対象サービスの現在状態を取得"
      ansible.builtin.shell:
        cmd: |
          for n in {{ target_services | join(' ') }}; do
            printf '%s:%s:%s\n' "$n" \
              "$(systemctl is-enabled "$n" 2>/dev/null || echo not-found)" \
              "$(systemctl is-active "$n" 2>/dev/null || echo inactive)"
          done
      changed_when: false
      check_mode: false
      register: svc_raw

    # サービスごとに「自動起動」「起動状態」の2レコードを作る。
    - name: "サービスごとにレコード化"
      ansible.builtin.set_fact:
        svc_rows: >-
          {{ svc_rows | default([]) + [
               { 'key': (key_base ~ '_enabled'),
                 'item': (svc_name ~ ' / 自動起動'),
                 'value': item.split(':')[1] },
               { 'key': (key_base ~ '_active'),
                 'item': (svc_name ~ ' / 起動状態'),
                 'value': item.split(':')[2] } ] }}
      loop: "{{ svc_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      vars:
        svc_name: "{{ item.split(':')[0] }}"
        key_base: "{{ sec.prefix ~ '_' ~ (item.split(':')[0] | regex_replace('[^0-9a-zA-Z_]', '_')) }}"

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        service_record: >-
          {{ { 'menu': sec_menu,
               'host_name': inventory_hostname,
               'section': ('(' ~ sec.num ~ ') ' ~ sec.name),
               'rows': (svc_rows | default([])) } }}

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ collect_dir }}/{{ sec.prefix }}_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: service_record } | to_nice_yaml }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: service_record
