---
# =====================================================================
# [収集] IPv6 設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# ipv6_info として JSON で出力する。
#
#   ipv6_info:
#     {"ipv6_enabled": false,            グローバルアドレスの有無による判定
#      "global_addrs": 0,                グローバル IPv6 アドレス数
#      "link_addrs": 0,                  リンクローカル IPv6 アドレス数
#      "sysctl_all_disable_ipv6": "0",   net.ipv6.conf.all.disable_ipv6
#      "sysctl_default_disable_ipv6": "0",
#      "connections": {"ens160": "disabled"}}   接続ごとの ipv6.method
#
# 対象の接続名は下の ipv6_connections で指定する
# （設定変更側の変数ファイルは参照しない）。
# 設定は一切変更しない（読み取りのみ）。
# =====================================================================
- name: "01_IPv6設定情報収集"
  hosts: linux
  gather_facts: false
  become: true

  vars:
    # 収集対象の nmcli 接続名
    # ※ 接続名に ':' を含む場合は取得結果の分割が崩れるため使わないこと
    ipv6_connections:
      - "ens160"

  tasks:
    - name: IPv6設定情報取得（Before）
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          printf 'global_addrs:%s\n' "$(ip -6 -o addr show scope global 2>/dev/null | wc -l)"
          printf 'link_addrs:%s\n'   "$(ip -6 -o addr show scope link 2>/dev/null | wc -l)"
          printf 'sysctl_all_disable_ipv6:%s\n'     "$(sysctl -n net.ipv6.conf.all.disable_ipv6 2>/dev/null)"
          printf 'sysctl_default_disable_ipv6:%s\n' "$(sysctl -n net.ipv6.conf.default.disable_ipv6 2>/dev/null)"
          for c in {{ ipv6_connections | map('quote') | join(' ') }}; do
            printf 'conn:%s:%s\n' "$c" "$(nmcli -g ipv6.method connection show "$c" 2>/dev/null)"
          done
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: nmcli_info

    # conn 以外の行は「キー:値」、conn 行は「conn:接続名:値」
    - name: パラメータシート登録用形式設定
      set_fact:
        ipv6_raw: >-
          {{ ipv6_raw | default({'connections': {}})
             | combine(({'connections': {f[1]: (f[2] | default('取得できず', true))}}
                        if f[0] == 'conn'
                        else {f[0]: f[1]}), recursive=true) }}
      vars:
        f: "{{ item.split(':') }}"
      loop: "{{ nmcli_info.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

    # グローバル IPv6 アドレスが1つも無ければ「IPv6 無効」と判定する
    - name: パラメータシート登録用形式設定（有効/無効の判定と型の整理）
      set_fact:
        ipv6_raw: >-
          {{ ipv6_raw | combine({
               'ipv6_enabled': ((ipv6_raw.global_addrs | int) > 0),
               'global_addrs': (ipv6_raw.global_addrs | int),
               'link_addrs': (ipv6_raw.link_addrs | int) }) }}

    - name: 取得情報出力
      debug:
        msg: |
          "{{ ipv6_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/ipv6"
        block: |
          ipv6_info: |
            {{ ipv6_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
      become: false
