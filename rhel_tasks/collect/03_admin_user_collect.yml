---
# =====================================================================
# [収集] 管理者権限ユーザー設定情報
#
# 取得した内容をユーザー名をキーにした 1 つの変数へまとめ、
# パラメータシート登録用ファイルへ admin_user_info として JSON で出力する。
#
#   admin_user_info:
#     {"mgAUTOXadm01": {"name": "mgAUTOXadm01",
#                       "exists": true,
#                       "uid": 1001,
#                       "shell": "/bin/bash",
#                       "home": "/home/mgAUTOXadm01",
#                       "groups": ["mgAUTOXadm01", "wheel"],
#                       "password_status": "PS",
#                       "sudo": "(ALL) ALL"}}
#
# 対象ユーザーは下の admin_users で指定する
# （設定変更側の変数ファイルは参照しない）。
#
# !!! 重要 !!! パスワードやハッシュは取得も出力もしない。
# password_status は passwd -S の2列目のみ（PS=設定済 / LK=ロック / NP=未設定）。
# =====================================================================
- name: "03_管理者権限ユーザー設定情報収集"
  hosts: linux
  gather_facts: false
  become: true

  vars:
    # 収集対象のユーザー名
    admin_users:
      - name: "mgAUTOXadm01"

  tasks:
    # 「ユーザー名:存在(1/0):UID:シェル:ホーム:所属グループ」の形で1行ずつ返す
    - name: 管理者権限ユーザー設定情報取得（Before）
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for n in {{ admin_users | map(attribute='name') | map('quote') | join(' ') }}; do
            if id "$n" >/dev/null 2>&1; then
              printf '%s:1:%s:%s:%s:%s:%s\n' "$n" \
                "$(id -u "$n")" \
                "$(getent passwd "$n" | cut -d: -f7)" \
                "$(getent passwd "$n" | cut -d: -f6)" \
                "$(id -nG "$n" | tr ' ' ',')" \
                "$(passwd -S "$n" 2>/dev/null | awk '{print $2}')"
            else
              printf '%s:0:::::\n' "$n"
            fi
          done
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: user_info

    # sudo -l の出力は "(root) NOPASSWD: ALL" のように ':' を含むため別タスクで取る
    - name: sudo 権限を取得 (sudo -l)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          sudo -l -U {{ item.name | quote }} 2>/dev/null | grep -E '^[[:space:]]*\(' | tr '\n' ' ' | tr -s ' '
        executable: /bin/bash
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: sudo_info

    - name: パラメータシート登録用形式設定
      set_fact:
        admin_user_raw: >-
          {{ admin_user_raw | default({}) | combine({ f[0]: {
               'name': f[0],
               'exists': (f[1] == '1'),
               'uid': ((f[2] | int) if (f[2] | length > 0) else none),
               'shell': (f[3] | default(none, true)),
               'home': (f[4] | default(none, true)),
               'groups': (f[5] | split(',') | reject('equalto', '') | list),
               'password_status': (f[6] | default(none, true)),
               'sudo': (sudo_line | default(none, true))
             } }) }}
      vars:
        f: "{{ item.split(':') }}"
        sudo_line: >-
          {{ (sudo_info.results | selectattr('item.name', 'eq', item.split(':')[0])
              | map(attribute='stdout') | first | default('', true)) | trim }}
      loop: "{{ user_info.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ admin_user_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/admin_user"
        block: |
          admin_user_info: |
            {{ admin_user_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
      become: false
