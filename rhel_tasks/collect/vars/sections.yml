# =====================================================================
# パラメータシートの大項目定義（RHEL / AlmaLinux のシステム設定）
#
# 各 collect Playbook は「1設定項目 = 1レコード」の形で結果を出力し、
# 99_register_parameters.yml がまとめてパラメータシートへ登録する。
#
# 登録されるレコードの形（縦持ち）:
#   大項目   : (1) IPv6無効化
#   項目名   : ens160 / ipv6.method
#   項目キー : l01_ipv6_method_ens160
#   設定値   : disabled
#
# 項目キーは大項目のプレフィックス（下記 prefix）を付けて出力する。
# Windows 側（windows_tasks/collect）は s01〜s17、Linux 側は l01〜 を使い、
# 同じシートへ登録してもキーが衝突しないようにしている。
# =====================================================================
param_sections:
  ipv6:    {num: 1, name: "IPv6無効化",             prefix: "l01_ipv6"}
  service: {num: 2, name: "サービス起動設定",       prefix: "l02_service"}
  user:    {num: 3, name: "管理者権限ユーザー",     prefix: "l03_user"}
  ntp:     {num: 4, name: "時刻同期設定",           prefix: "l04_ntp"}

# =====================================================================
# パラメータシートの列名
#
# !!! 重要 !!! ここに書いた文字列が、そのまま API の parameter のキーになる。
# Exastro で作成したパラメータシートの「項目名」と完全に一致させること。
# windows_tasks/collect/vars/sections.yml と同じ4列構成にしているため、
# Windows と Linux で同じパラメータシートを共用できる。
# =====================================================================
param_columns:
  section: "大項目"      # 例: (1) IPv6無効化
  item: "項目名"         # 例: ens160 / ipv6.method
  key: "項目キー"        # 例: l01_ipv6_method_ens160
  value: "設定値"        # 例: disabled

# =====================================================================
# 登録先メニュー
#
# 既定では全ての大項目を1つのパラメータシートへ登録する。
# 大項目ごとにシートを分ける場合は param_section_menus に
# 「大項目キー: メニューID」を書けば、そのシートへ登録される。
# =====================================================================
param_section_menu_default: "check_parameter"
param_section_menus: {}

# =====================================================================
# 収集結果の出力先
#
# Exastro の Conductor から実行すると __conductor_workflowdir__ が渡るため
# 通常は変更不要。単体で動かすときは playbook_dir/_collected に出力する。
# =====================================================================
collect_dir: "{{ __conductor_workflowdir__ | default(playbook_dir + '/_collected') }}"
