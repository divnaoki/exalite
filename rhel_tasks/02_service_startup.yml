---
# =====================================================================
# 02_サービス起動設定
#
#   PHASE 1  変更前の設定情報を取得（自動起動 / 稼働状態）
#   PHASE 2  現在値と異なる場合のみ変更（冪等）
#   PHASE 3  変更後の設定情報を取得して確認
#
# 対象サービスを「自動起動 ON + 起動」に揃える。
# パッケージの導入は行わない（導入済み前提）。
# 設定値は vars/02_service_startup.yml で定義。
# =====================================================================
- name: "02_サービス起動設定"
  hosts: linux
  gather_facts: false
  become: true

  vars_files:
    - vars/02_service_startup.yml

  tasks:
    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    # 「ユニット名:is-enabled:is-active」の形で1行ずつ返す。
    # 存在しないユニットは is-enabled が異常終了するため既定値を入れる。
    - name: "[BEFORE] 対象サービスの現在状態を取得"
      ansible.builtin.shell:
        cmd: |
          for n in {{ target_services | join(' ') }}; do
            printf '%s:%s:%s\n' "$n" \
              "$(systemctl is-enabled "$n" 2>/dev/null || echo not-found)" \
              "$(systemctl is-active "$n" 2>/dev/null || echo inactive)"
          done
      changed_when: false
      check_mode: false
      register: svc_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        svc_before: >-
          {{ svc_before | default({}) | combine({
               (item.split(':')[0]): {'enabled': item.split(':')[1],
                                      'active': item.split(':')[2]} }) }}
      loop: "{{ svc_before_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: "[BEFORE] 現在状態と指定値を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item }} : 自動起動 {{ svc_before[item].enabled }} -> enabled /
          状態 {{ svc_before[item].active }} -> active
      loop: "{{ target_services }}"

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================
    - name: "自動起動 ON + 起動"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ target_services }}"
      when: >-
        (svc_before[item].enabled != 'enabled')
        or (svc_before[item].active != 'active')

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] 対象サービスの状態を再取得"
      ansible.builtin.shell:
        cmd: |
          for n in {{ target_services | join(' ') }}; do
            printf '%s:%s:%s\n' "$n" \
              "$(systemctl is-enabled "$n" 2>/dev/null || echo not-found)" \
              "$(systemctl is-active "$n" 2>/dev/null || echo inactive)"
          done
      changed_when: false
      check_mode: false
      register: svc_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        svc_after: >-
          {{ svc_after | default({}) | combine({
               (item.split(':')[0]): {'enabled': item.split(':')[1],
                                      'active': item.split(':')[2]} }) }}
      loop: "{{ svc_after_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: "[AFTER] 変更後の状態を表示"
      ansible.builtin.debug:
        var: svc_after

    - name: "[AFTER] 設定値が反映されたことを確認"
      ansible.builtin.assert:
        that:
          - svc_after[item].enabled == 'enabled'
          - svc_after[item].active == 'active'
        success_msg: "{{ item }} : 自動起動 ON / 起動済みです。"
        fail_msg: >-
          {{ item }} の設定が一致しません
          (実際: 自動起動={{ svc_after[item].enabled }}, 状態={{ svc_after[item].active }})。
      loop: "{{ target_services }}"
      # check モード（dryrun）では変更が行われないため確認はスキップする
      when: not ansible_check_mode
