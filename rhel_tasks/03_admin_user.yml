---
# =====================================================================
# 03_管理者権限ユーザー作成
#
#   PHASE 1  変更前の設定情報を取得（存在 / 所属グループ / シェル）
#   PHASE 2  現在値と異なる場合のみ変更（冪等）
#   PHASE 3  変更後の設定情報を取得して確認（sudo 権限まで確認）
#
# 管理者権限は sudo 権限グループ（wheel）への追加で与える。
# /etc/sudoers は編集しない（RHEL 既定で %wheel の許可行が有効なため）。
# パスワードは server_admin_accounts（機密パラメータ / extra-vars）で渡す。
# 設定値は vars/03_admin_user.yml で定義。
# =====================================================================
- name: "03_管理者権限ユーザー作成"
  hosts: linux
  gather_facts: false
  become: true

  vars_files:
    - vars/03_admin_user.yml

  tasks:
    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    # 「ユーザー名:存在(1/0):シェル:所属グループ」の形で1行ずつ返す。
    - name: "[BEFORE] 対象ユーザーの現在状態を取得"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for n in {{ admin_users | map(attribute='name') | join(' ') }}; do
            if id "$n" >/dev/null 2>&1; then
              printf '%s:1:%s:%s\n' "$n" \
                "$(getent passwd "$n" | cut -d: -f7)" "$(id -nG "$n" | tr ' ' ',')"
            else
              printf '%s:0::\n' "$n"
            fi
          done
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: user_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        users_before: >-
          {{ users_before | default({}) | combine({
               (item.split(':')[0]): {
                 'exists': (item.split(':')[1] == '1'),
                 'shell': item.split(':')[2],
                 'groups': (item.split(':')[3] | split(',') | reject('equalto', '') | list) } }) }}
      loop: "{{ user_before_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    - name: "[BEFORE] 現在状態と指定値を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item.name }} : 存在={{ users_before[item.name].exists }} -> True /
          グループ={{ users_before[item.name].groups | join(',') | default('(なし)', true) }}
          -> {{ item.groups | join(',') }} を追加 /
          シェル={{ users_before[item.name].shell | default('(なし)', true) }} -> {{ item.shell }}
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    # 新規作成が必要なユーザーにパスワードが渡っているかを、変更前に検証する。
    # no_log は付けない。assert が出すのは条件式の文字列と fail_msg だけで、
    # パスワードの値は出力されない（付けると対処方法が censored で隠れる）。
    - name: "[GUARD] 新規作成に必要なパスワードが渡っていることを検証"
      ansible.builtin.assert:
        that:
          - >-
            users_before[item.name].exists
            or (((server_admin_accounts | default({}))[item.name] | default('')) | length > 0)
        success_msg: "{{ item.name }} : 実行可能です。"
        fail_msg: >-
          {{ item.name }} は対象サーバーに存在せず、パスワードも渡されていません。
          server_admin_accounts で渡してください
          （例: -e '{"server_admin_accounts":{"{{ item.name }}":"＜パスワード＞"}}'）。
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================
    # ソルトはユーザー名から決まる固定値にする。
    # 毎回ランダムにすると同じパスワードでもハッシュが変わり、差分が出続けるため。
    - name: "管理者権限ユーザーを作成・更新"
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        append: true                       # 既存の所属は削除しない
        shell: "{{ item.shell }}"
        state: present
        update_password: on_create         # 既存ユーザーのパスワードは変更しない
        password: >-
          {{ (server_admin_accounts[item.name]
              | password_hash('sha512', 65534 | random(seed=item.name) | string))
             if (((server_admin_accounts | default({}))[item.name] | default('')) | length > 0)
             else omit }}
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        (not users_before[item.name].exists)
        or ((item.groups | difference(users_before[item.name].groups)) | length > 0)
        or (users_before[item.name].shell != item.shell)
      no_log: true                         # パスワードを含むためログに出さない

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] 対象ユーザーの状態を再取得"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for n in {{ admin_users | map(attribute='name') | join(' ') }}; do
            if id "$n" >/dev/null 2>&1; then
              printf '%s:1:%s:%s\n' "$n" \
                "$(getent passwd "$n" | cut -d: -f7)" "$(id -nG "$n" | tr ' ' ',')"
            else
              printf '%s:0::\n' "$n"
            fi
          done
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: user_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        users_after: >-
          {{ users_after | default({}) | combine({
               (item.split(':')[0]): {
                 'exists': (item.split(':')[1] == '1'),
                 'shell': item.split(':')[2],
                 'groups': (item.split(':')[3] | split(',') | reject('equalto', '') | list) } }) }}
      loop: "{{ user_after_raw.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"

    # 実際に sudo が使えるか（管理者権限が付いたか）を機能面から確認する。
    - name: "[AFTER] sudo 権限を確認 (sudo -l)"
      ansible.builtin.command:
        cmd: "sudo -l -U {{ item.name }}"
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: sudo_check

    - name: "[AFTER] 変更後の状態を表示"
      ansible.builtin.debug:
        msg:
          - "{{ users_after }}"
          - "{{ sudo_check.results | map(attribute='stdout') | map('trim') | list }}"

    - name: "[AFTER] 設定値が反映されたことを確認"
      ansible.builtin.assert:
        that:
          - users_after[item.item.name].exists
          - (item.item.groups | difference(users_after[item.item.name].groups)) | length == 0
          - users_after[item.item.name].shell == item.item.shell
          # sudo -l に (ALL) が出れば管理者権限が有効
          - "'(ALL)' in (item.stdout | default(''))"
        success_msg: >-
          {{ item.item.name }} : グループ={{ users_after[item.item.name].groups | join(',') }} /
          シェル={{ users_after[item.item.name].shell }} / sudo 権限ありで作成されています。
        fail_msg: >-
          {{ item.item.name }} の設定が一致しません
          (実際={{ users_after[item.item.name] }} /
           sudo -l={{ item.stdout | default('') | trim }} /
           期待: グループ={{ item.item.groups | join(',') }}, シェル={{ item.item.shell }}, sudo 権限あり)。
      loop: "{{ sudo_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      # check モード（dryrun）では変更が行われないため確認はスキップする
      when: not ansible_check_mode
