---
# =====================================================================
# 10_サーバーの役割と機能
#
# 構成ルール:
#   PHASE 0  パラメータシート値の正規化と、保護対象機能のガード（変更前に停止）
#   PHASE 1  変更前の設定情報を取得（必ず取得）
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を再取得して確認
#
# 前提:
#   - Exastro のパラメータシートから機能レコードごとに True/False が渡る。
#       True  = インストールする（未導入なら追加、導入済みなら何もしない）
#       False = アンインストールする（導入済みなら削除、未導入なら何もしない）
#   - 値は文字列で渡るため PHASE 0 で `| bool` を通して真偽値に正規化している。
#     （文字列 "False" は Jinja の真偽判定では True になるため、
#       selectattr/rejectattr を使う前に必ず正規化すること）
#   - 対象サーバーに存在しない機能はエラーにせずスキップする。
#
# 設定値は vars/10_server_features.yml で定義。
# シェル実行は win_powershell ではなく win_shell を使用（本業環境に合わせる）。
# 機能の追加・削除は専用モジュール win_feature を使用（前後取得と when は同様に実施）。
# =====================================================================
- name: "10_サーバーの役割と機能"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/10_server_features.yml

  tasks:
    # =================================================================
    # PHASE 0: パラメータシート値の正規化とガード
    # =================================================================
    - name: "[PREP] パラメータシート値(文字列)を真偽値に正規化"
      ansible.builtin.set_fact:
        features: >-
          {{ features | default([])
             + [ item | combine({'enabled': (item.enabled | default(false) | bool)}) ] }}
      loop: "{{ target_features }}"
      loop_control:
        label: "{{ item.name }} = {{ item.enabled | default(false) }}"

    - name: "[GUARD] 保護対象の機能が削除指定されていないか検証"
      ansible.builtin.assert:
        that:
          - >-
            (features | rejectattr('enabled') | map(attribute='name') | map('lower') | list
             | select('in', protected_features | map('lower') | list)
             | list | length) == 0
        success_msg: "保護対象の機能に削除指定はありません。処理を継続します。"
        fail_msg: >-
          保護対象の機能が削除(False)指定されています:
          {{ features | rejectattr('enabled') | map(attribute='name') | map('lower') | list
             | select('in', protected_features | map('lower') | list) | list }}
          — 削除すると Ansible(WinRM) の接続または OS の動作が失われるため中止しました。

    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    # Get-WindowsFeature に存在しない機能名を -Name で渡すと非終了エラーになるため、
    # 全機能を一括取得してから名前で引く（存在しないものは Exists=false として返す）。
    # ※ Windows PowerShell 5.1 の ConvertTo-Json は非 ASCII を \uXXXX に
    #   エスケープするため、日本語の DisplayName でも文字化けしない。
    - name: "[BEFORE] 対象の役割と機能の現在状態を取得"
      ansible.windows.win_shell: |
        $names = '{{ features | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        Import-Module ServerManager -ErrorAction SilentlyContinue

        $all = @{}
        foreach ($f in (Get-WindowsFeature)) { $all[$f.Name.ToLower()] = $f }

        $list = @()
        foreach ($n in $names) {
          $key = $n.ToLower()
          if ($all.ContainsKey($key)) {
            $f = $all[$key]
            $state = $f.InstallState.ToString()
            $list += [PSCustomObject][ordered]@{
              Name         = $n
              Exists       = $true
              DisplayName  = $f.DisplayName
              InstallState = $state
              Installed    = [bool]$f.Installed
              # Removed = ペイロード削除済み。インストールには -Source が必要
              Removed      = ($state -eq 'Removed')
              # InstallPending / UninstallPending = 再起動待ち
              Pending      = ($state -like '*Pending')
              Path         = $f.Path
            }
          } else {
            # OS/エディションによって存在しない機能。エラーにせずスキップ対象にする
            $list += [PSCustomObject][ordered]@{
              Name         = $n
              Exists       = $false
              DisplayName  = $null
              InstallState = $null
              Installed    = $false
              Removed      = $false
              Pending      = $false
              Path         = $null
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: feat_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        feat_before: "{{ feat_before_raw.stdout | from_json }}"

    - name: "[BEFORE] 機能名で引ける辞書を作成"
      ansible.builtin.set_fact:
        feat_before_map: "{{ dict(feat_before | map(attribute='Name') | zip(feat_before)) }}"

    - name: "[BEFORE] 現在状態を表示"
      ansible.builtin.debug:
        var: feat_before

    # --- 実行計画の作成 ---
    # 「指定値」と「現在値」を突き合わせ、機能ごとの action を確定させる。
    #   install       : True 指定 かつ 未導入          -> 追加する
    #   uninstall     : False 指定 かつ 導入済み        -> 削除する
    #   skip_nochange : 既に指定値と一致               -> 何もしない
    #   skip_missing  : 対象サーバーに存在しない       -> 何もしない（エラーにしない）
    - name: "[PLAN] 機能ごとの実行内容を確定"
      ansible.builtin.set_fact:
        feat_plan: >-
          {{ feat_plan | default([]) + [ {
               'name': item.name,
               'label': item.label | default(''),
               'desired': item.enabled,
               'exists': feat_before_map[item.name].Exists | bool,
               'installed': feat_before_map[item.name].Installed | bool,
               'removed': feat_before_map[item.name].Removed | bool,
               'state': feat_before_map[item.name].InstallState | default('存在しない', true),
               'source': item.source | default(feature_source) | default('', true),
               'action': (
                 'skip_missing' if not (feat_before_map[item.name].Exists | bool)
                 else ('install' if (item.enabled and not (feat_before_map[item.name].Installed | bool))
                 else ('uninstall' if ((not item.enabled) and (feat_before_map[item.name].Installed | bool))
                 else 'skip_nochange'))
               )
             } ] }}
      loop: "{{ features }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "[PLAN] 処理内容の内訳を表示"
      ansible.builtin.debug:
        msg:
          - "インストールする        : {{ feat_plan | selectattr('action', 'eq', 'install') | map(attribute='name') | list }}"
          - "アンインストールする    : {{ feat_plan | selectattr('action', 'eq', 'uninstall') | map(attribute='name') | list }}"
          - "既に指定値のためスキップ: {{ feat_plan | selectattr('action', 'eq', 'skip_nochange') | map(attribute='name') | list }}"
          - "存在しないためスキップ  : {{ feat_plan | selectattr('action', 'eq', 'skip_missing') | map(attribute='name') | list }}"

    # ペイロード削除済み(Removed)の機能をソース未指定でインストールすると
    # 「ソース ファイルが見つかりませんでした」で失敗する。事前に警告する。
    - name: "[PLAN] ソース指定が必要な機能を警告"
      ansible.builtin.debug:
        msg: >-
          以下の機能は InstallState=Removed（ペイロード削除済み）です。
          feature_source にインストールメディアの sources\sxs パスを指定しないと
          インストールに失敗する可能性があります:
          {{ feat_plan | selectattr('action', 'eq', 'install') | selectattr('removed')
             | rejectattr('source') | map(attribute='name') | list }}
      when: >-
        (feat_plan | selectattr('action', 'eq', 'install') | selectattr('removed')
         | rejectattr('source') | list | length) > 0

    # 再起動待ち(*Pending)の状態では追加・削除が失敗することがあるため明示する。
    - name: "[PLAN] 再起動待ちの機能を警告"
      ansible.builtin.debug:
        msg: >-
          以下の機能は再起動待ち(InstallPending / UninstallPending)です。
          先に対象サーバーを再起動してから実行することを推奨します:
          {{ feat_before | selectattr('Exists') | selectattr('Pending')
             | map(attribute='Name') | list }}
      when: >-
        (feat_before | selectattr('Exists') | selectattr('Pending') | list | length) > 0

    # =================================================================
    # PHASE 2: 変更（action が install / uninstall のものだけ実行）
    # =================================================================
    # インストールは親から順に実行する（vars の記載順＝親→子）。
    - name: "役割と機能をインストール"
      ansible.windows.win_feature:
        name: "{{ item.name }}"
        state: present
        include_management_tools: "{{ feature_include_management_tools | default(false) | bool }}"
        # 空文字のときは source を渡さない（Windows Update からの取得を試みる）
        source: "{{ item.source if (item.source | length > 0) else omit }}"
      loop: "{{ feat_plan }}"
      loop_control:
        label: "{{ item.name }} / {{ item.label }} (現在: {{ item.state }})"
      when: item.action == 'install'
      register: feat_install_result

    # アンインストールは子から順に実行する（リストを逆順にする）。
    # 親を先に削除すると子が巻き添えで消え、後続タスクの判定がずれるため。
    - name: "役割と機能をアンインストール"
      ansible.windows.win_feature:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ feat_plan | reverse | list }}"
      loop_control:
        label: "{{ item.name }} / {{ item.label }} (現在: {{ item.state }})"
      when: item.action == 'uninstall'
      register: feat_uninstall_result

    # --- 変更直後の接続性確認 ---
    # 機能の追加・削除の影響で WinRM のシェル生成が壊れるケースがあるため、
    # 実行中にその場で検知する（次回実行まで気づけない事態を防ぐ）。
    - name: "[CHECK] 変更後も WinRM 接続が維持されているか確認"
      ansible.windows.win_ping:
      register: conn_check
      retries: 3
      delay: 10
      until: conn_check is succeeded

    # --- 再起動要否の判定 ---
    - name: "再起動要否を変数に格納"
      ansible.builtin.set_fact:
        feat_reboot_required: >-
          {{ ((feat_install_result.results | default([])
               | selectattr('reboot_required', 'defined')
               | selectattr('reboot_required') | list | length) > 0)
             or ((feat_uninstall_result.results | default([])
                  | selectattr('reboot_required', 'defined')
                  | selectattr('reboot_required') | list | length) > 0) }}

    - name: "再起動を実行（feature_allow_reboot が True の場合のみ）"
      ansible.windows.win_reboot:
        reboot_timeout: 1800
      when:
        - feat_reboot_required | bool
        - feature_allow_reboot | default(false) | bool

    - name: "再起動が必要である旨を警告（再起動は実施しない）"
      ansible.builtin.debug:
        msg: >-
          役割と機能の変更により再起動が必要です。
          feature_allow_reboot が False のため再起動は実施していません。
          設定を完全に反映するには対象サーバーを再起動してください。
      when:
        - feat_reboot_required | bool
        - not (feature_allow_reboot | default(false) | bool)

    # =================================================================
    # PHASE 3: 変更後の設定情報を再取得（確認）
    # =================================================================
    - name: "[AFTER] 対象の役割と機能の状態を再取得"
      ansible.windows.win_shell: |
        $names = '{{ features | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        Import-Module ServerManager -ErrorAction SilentlyContinue

        $all = @{}
        foreach ($f in (Get-WindowsFeature)) { $all[$f.Name.ToLower()] = $f }

        $list = @()
        foreach ($n in $names) {
          $key = $n.ToLower()
          if ($all.ContainsKey($key)) {
            $f = $all[$key]
            $state = $f.InstallState.ToString()
            $list += [PSCustomObject][ordered]@{
              Name         = $n
              Exists       = $true
              DisplayName  = $f.DisplayName
              InstallState = $state
              Installed    = [bool]$f.Installed
              Removed      = ($state -eq 'Removed')
              Pending      = ($state -like '*Pending')
              Path         = $f.Path
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name         = $n
              Exists       = $false
              DisplayName  = $null
              InstallState = $null
              Installed    = $false
              Removed      = $false
              Pending      = $false
              Path         = $null
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: feat_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        feat_after: "{{ feat_after_raw.stdout | from_json }}"

    - name: "[AFTER] 機能名で引ける辞書を作成"
      ansible.builtin.set_fact:
        feat_after_map: "{{ dict(feat_after | map(attribute='Name') | zip(feat_after)) }}"

    - name: "[AFTER] 変更後の状態を表示"
      ansible.builtin.debug:
        var: feat_after

    # 再起動待ち(*Pending)の機能は、再起動するまで InstallState が確定しないため
    # 合格扱いとする（未再起動を理由に Playbook 全体を失敗させない）。
    - name: "[AFTER] 指定値どおりに設定されたことを確認"
      ansible.builtin.assert:
        that:
          - >-
            (feat_after_map[item.name].Installed | bool) == (item.enabled | bool)
            or (feat_after_map[item.name].Pending | bool)
        success_msg: >-
          {{ item.name }} : 指定値と一致しました
          (InstallState={{ feat_after_map[item.name].InstallState }},
          指定={{ item.enabled }})。
        fail_msg: >-
          {{ item.name }} : 指定値と一致しません
          (InstallState={{ feat_after_map[item.name].InstallState }},
          Installed={{ feat_after_map[item.name].Installed }},
          指定={{ item.enabled }})。
      loop: "{{ features }}"
      loop_control:
        label: "{{ item.name }} / {{ item.label | default('') }}"
      when: feat_after_map[item.name].Exists | bool

    - name: "[AFTER] 再起動待ちの機能を報告"
      ansible.builtin.debug:
        msg: >-
          以下の機能は再起動後に状態が確定します:
          {{ feat_after | selectattr('Exists') | selectattr('Pending')
             | map(attribute='Name') | list }}
      when: >-
        (feat_after | selectattr('Exists') | selectattr('Pending') | list | length) > 0

    - name: "[AFTER] 存在しなかった機能を報告"
      ansible.builtin.debug:
        msg: >-
          以下の機能は対象サーバーに存在しないためスキップしました:
          {{ feat_after | rejectattr('Exists') | map(attribute='Name') | list }}
      when: (feat_after | rejectattr('Exists') | list | length) > 0
