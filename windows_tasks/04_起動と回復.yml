# 04_起動と回復 : Ansibleタスク
# Exastro IT Automation V2 / 財務省GSS連携システム
# 自動生成: グループ内で内容が完全一致するタスクは重複排除済み

- name: システムエラー時のデバッグ情報書き込み設定
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl
    name: CrashDumpEnabled
    data: "{{ startup_recovery_write_debug_info }}"
    type: dword
