---
# 04_起動と回復 : Ansibleタスク
# 自動生成: グループ内で内容が完全一致するタスクは重複排除済み
#
# ── 使用変数一覧 ─────────────────────────────
#
#   startup_recovery_write_debug_info (選択): なし(0) / 完全メモリダンプ(1) / カーネルメモリダンプ(2) / 小メモリダンプ(3) / 自動メモリダンプ(7)
#──────────────────────────────────────────────

- name: システムエラー時のデバッグ情報書き込み設定
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl
    name: CrashDumpEnabled
    # 設定可能な値 → startup_recovery_write_debug_info(選択): なし(0) / 完全メモリダンプ(1) / カーネルメモリダンプ(2) / 小メモリダンプ(3) / 自動メモリダンプ(7)
    data: "{{ startup_recovery_write_debug_info }}"
    type: dword
