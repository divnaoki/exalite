---
# 01_リモートデスクトップ : Ansibleタスク
# Exastro IT Automation V2 / 財務省GSS連携システム
# 自動生成: グループ内で内容が完全一致するタスクは重複排除済み

- name: リモートデスクトップ接続を許可する
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: リモートデスクトップのファイアウォールルールを有効化
  ansible.windows.win_firewall_rule:
    name: リモート デスクトップ - ユーザー モード (TCP-受信)
    enable: yes
    action: allow

- name: RDPでネットワークレベル認証(NLA)を必須にする
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 1
    type: dword
