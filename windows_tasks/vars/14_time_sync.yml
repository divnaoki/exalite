# =====================================================================
# 14_時刻同期 : 変数定義
#
# パラメータシートの対応:
#   インターネット時刻サーバーと同期する -> TRUE
#   サーバー                             -> 172.16.1.1
#
# Exastro からは文字列で渡るため、Playbook 側で `| bool` を通して評価する。
# =====================================================================

# 「インターネット時刻サーバーと同期する」
#   True  = 指定した NTP サーバーと同期する（Type=NTP）
#   False = 同期しない（Type=NoSync）
ntp_sync_enabled: True

# 同期先サーバー。GUI と同じ書式で「アドレス,フラグ」を指定する。
# 0x9 = クライアントモード + 特別なポーリング間隔（GUI で設定したときと同じ値）。
# 複数指定する場合は半角スペース区切り（例: "172.16.1.1,0x9 172.16.1.2,0x9"）。
ntp_servers: "172.16.1.1,0x9"
