# =====================================================================
# 12_ソフトウェア制御（UAC設定）: 変数定義
#
# パラメータシート:
#   ユーザーアカウントの設定 > コンピューターに対する変更の通知を受け取る
#   タイミングの選択
#
# Exastro からは「画面に表示される日本語のラベル」がそのまま渡る想定。
#   例) "アプリがコンピューターに変更を加えようとする場合のみ通知する（既定）"
#
# 表記ゆれ（全角/半角カッコ、空白、コンピュータ/コンピューター、「（既定）」の
# 有無）は Playbook 側で正規化して判定するため、どの書き方でも一致する。
# スライダーの段階（1〜4）を数値で渡すことも可能。
#
# !!! 注意 !!! 旧 14_ソフトウェア制御.yml の uac_notification_level とは
# 別物なので変数名を分けている。旧変数は ConsentPromptBehaviorAdmin の
# 生値（0〜5）を渡す想定で、本 Playbook の指定値とは意味が異なる。
# =====================================================================

# 設定する通知レベル（パラメータシートの値）
uac_notification_setting: "アプリがコンピューターに変更を加えようとする場合のみ通知する（既定）"

# =====================================================================
# UAC スライダーの段階とレジストリ値の対応表
#
# 実体: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
#   ConsentPromptBehaviorAdmin : 管理者に対する昇格プロンプトの動作
#   PromptOnSecureDesktop      : セキュリティで保護されたデスクトップ（画面の暗転）
#   EnableLUA                  : UAC 自体の有効/無効（全レベル共通で 1）
#
# スライダーの位置は上記2値の組み合わせで決まるため、必ずセットで設定する。
# 片方だけ変更するとコントロールパネル上の表示と実際の挙動がずれる。
# ※ この表は変更しないこと（Windows の仕様）。
# =====================================================================
uac_levels:
  # 一番上（最も厳しい）
  - level: 4
    label: "常に通知する"
    consent_prompt_behavior_admin: 2
    prompt_on_secure_desktop: 1

  # 上から2番目 = Windows 既定。今回のパラメータシートの指定値。
  - level: 3
    label: "アプリがコンピューターに変更を加えようとする場合のみ通知する（既定）"
    consent_prompt_behavior_admin: 5
    prompt_on_secure_desktop: 1

  # 上から3番目（デスクトップを暗転しない）
  - level: 2
    label: "アプリがコンピューターに変更を加えようとする場合のみ通知する（デスクトップを暗転しない）"
    consent_prompt_behavior_admin: 5
    prompt_on_secure_desktop: 0

  # 一番下（通知しない）
  - level: 1
    label: "通知しない"
    consent_prompt_behavior_admin: 0
    prompt_on_secure_desktop: 0

# =====================================================================
# 動作オプション
# =====================================================================

# EnableLUA が 0（UAC 自体が無効）だった場合に 1 へ戻すか。
# スライダーのどの段階も EnableLUA=1 が前提のため、既定で有効化する。
# ※ EnableLUA の変更は再起動しないと反映されない（他の2値は即時反映）。
uac_enforce_enable_lua: True

# EnableLUA を変更して再起動が必要になった場合に、Playbook 内で再起動するか。
# False の場合は再起動せず、要再起動である旨を警告表示して終了する。
uac_allow_reboot: False
