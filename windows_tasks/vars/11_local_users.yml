# =====================================================================
# 11_ローカルユーザー設定 : 変数定義
#
# Exastro のパラメータシート「ローカルユーザーとグループ」の各行に対応する。
# 1レコード = 1ユーザーとして下記の形で渡す。
#
#   local_users:
#     - name: "Administrator"           # ユーザー名
#       label: "Administrator のプロパティ"
#       create: False                   # True = 存在しなければ新規作成する
#       fullname: ""                    # フルネーム（空文字なら変更しない）
#       description: ""                 # 説明（空文字なら変更しない）
#       must_change_password: False     # ユーザーは次回ログオン時にパスワードの変更が必要
#       cannot_change_password: False   # ユーザーはパスワードを変更できない
#       password_never_expires: False   # パスワードを無期限にする
#       account_disabled: True          # アカウントを無効にする
#       groups: ["Administrators"]      # 所属するグループ（追加のみ。既存の所属は削除しない）
#
# ※ Exastro からは値が文字列で渡るため、Playbook 側は PHASE 0 で `| bool` を
#   通して真偽値に正規化している（文字列 "False" は Jinja では True 扱いになるため）。
# ※ パラメータシートに存在しないユーザーはエラーにせずスキップする
#   （create: True のレコードのみ新規作成する）。
# =====================================================================

# ---------------------------------------------------------------------
# 対象ユーザー
#
# 【並び順の意味】
#   上から順に処理する。新規ユーザー(mgprtsvadm01)を先に作成して
#   Administrators へ追加してから、既定の Administrator を無効化する。
#   逆順にすると管理者アカウントが1つも無い状態が発生しうるため入れ替えないこと。
# ---------------------------------------------------------------------
local_users:
  # --- 新しいユーザー（パラメータシート「新しいユーザー」の行）---
  # パスワードはパラメータシートには記載せず、Exastro の機密パラメータから
  # local_user_passwords で渡すこと（下部の定義を参照）。
  - name: "mgprtsvadm01"
    label: "新しいユーザー"
    create: True
    fullname: ""                    # シート上は未記入
    description: ""                 # シート上は未記入
    must_change_password: False     # ユーザーは次回ログオン時にパスワードの変更が必要
    cannot_change_password: False   # ユーザーはパスワードを変更できない
    password_never_expires: False   # パスワードを無期限にする
    account_disabled: False         # アカウントを無効にする
    groups:                         # グループ Administrators > 追加 > ユーザーの選択
      - "Administrators"

  # --- Administrator のプロパティ ---
  # !!! 重要 !!! account_disabled: True は「既定の Administrator を無効化する」指定。
  # Ansible がこのアカウントで接続している場合、無効化した時点で以降の接続が
  # 失われるため、Playbook では最後のタスクに回している。
  # 既定では実行せずスキップし、allow_disable_connection_account: True を
  # 明示したときだけ実行する。
  - name: "Administrator"
    label: "Administrator のプロパティ"
    create: False
    must_change_password: False     # □
    cannot_change_password: False   # □
    password_never_expires: False   # □
    account_disabled: True          # ■（既定値は □ → シートで変更）
    groups:
      - "Administrators"

  # --- Guest のプロパティ ---
  - name: "Guest"
    label: "Guest のプロパティ"
    create: False
    must_change_password: False     # □
    cannot_change_password: True    # ■
    password_never_expires: True    # ■
    account_disabled: True          # ■
    groups:
      - "Guests"

# =====================================================================
# パスワード（機密情報）
#
# !!! 重要 !!! ここに実際のパスワードを書いてコミットしないこと。
# Exastro の機密パラメータ、または ansible-vault / extra-vars で渡す。
#   例) ansible-playbook 11_local_users.yml \
#         -e '{"local_user_passwords":{"mgprtsvadm01":"<パスワード>"}}'
#
# - create: True のユーザーが「対象サーバーに存在しない」場合のみ必須。
#   （既に存在する場合はパスワードを変更しない: update_password=on_create）
# - パスワードを扱うタスクには no_log: true を設定しており、ログには出力されない。
# =====================================================================
local_user_passwords: {}

# =====================================================================
# 動作オプション
# =====================================================================

# Ansible が接続しているアカウント自身を無効化することを許可するか。
#
# False（既定）: 接続アカウントの無効化はスキップし、警告のみ出力する。
#                他の管理者アカウント（mgprtsvadm01）で接続し直してから
#                再実行するのが安全な運用手順。
# True         : 全ての設定・確認が終わった最後のタスクとして無効化する。
#                実行した時点で以降その資格情報では接続できなくなるため、
#                Exastro のインベントリを新しい管理者アカウントに切り替えること。
allow_disable_connection_account: False

# 「所属するグループ」の扱い。
# シートの指定は「追加」のみのため add 固定（既存の所属は削除しない）。
# replace にすると Users など既定の所属まで剥がれるため変更しないこと。
local_user_groups_action: "add"
