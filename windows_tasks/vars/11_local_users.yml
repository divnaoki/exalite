# =====================================================================
# 11_ローカルユーザー設定 : 変数定義
#
# Exastro のパラメータシート「ローカルユーザーとグループ」の各行に対応する。
# 1レコード = 1ユーザーとして下記の形で渡す。
#
#   local_users:
#     - name: "Administrator"           # ユーザー名
#       label: "Administrator のプロパティ"
#       create: False                   # True = 存在しなければ新規作成する
#       fullname: ""                    # フルネーム（空文字なら変更しない）
#       description: ""                 # 説明（空文字なら変更しない）
#       must_change_password: False     # ユーザーは次回ログオン時にパスワードの変更が必要
#       cannot_change_password: False   # ユーザーはパスワードを変更できない
#       password_never_expires: False   # パスワードを無期限にする
#       account_disabled: True          # アカウントを無効にする
#       groups: ["Administrators"]      # 所属するグループ（追加のみ。既存の所属は削除しない）
#
# ※ Exastro からは値が文字列で渡るため、Playbook 側は PHASE 0 で `| bool` を
#   通して真偽値に正規化している（文字列 "False" は Jinja では True 扱いになるため）。
# ※ パラメータシートに存在しないユーザーはエラーにせずスキップする
#   （create: True のレコードのみ新規作成する）。
# =====================================================================

# ---------------------------------------------------------------------
# 対象ユーザー
#
# 【並び順の意味】
#   上から順に処理する。新規ユーザー(mgprtsvadm01)を先に作成して
#   Administrators へ追加してから、既定の Administrator を無効化する。
#   逆順にすると管理者アカウントが1つも無い状態が発生しうるため入れ替えないこと。
# ---------------------------------------------------------------------
local_users:
  # --- 新しいユーザー（パラメータシート「新しいユーザー」の行）---
  # パスワードはここには書かない。server_admin_accounts の
  # 「同じユーザー名のレコード」から取得する（下部の説明を参照）。
  - name: "mgprtsvadm01"
    label: "新しいユーザー"
    create: True
    fullname: ""                    # シート上は未記入
    description: ""                 # シート上は未記入
    must_change_password: False     # ユーザーは次回ログオン時にパスワードの変更が必要
    cannot_change_password: False   # ユーザーはパスワードを変更できない
    password_never_expires: True    # パスワードを無期限にする
    account_disabled: False         # アカウントを無効にする
    groups:                         # グループ Administrators > 追加 > ユーザーの選択
      - "Administrators"

  # --- Administrator のプロパティ ---
  # account_disabled: True は「既定の Administrator を無効化する」指定。
  # Ansible は各サービスの管理者ユーザー（mgprtsvadm01 等）で接続するため、
  # 無効化しても接続は失われない。
  # ただし万一 Administrator で接続している状態で実行した場合は、
  # Playbook 側のガード（接続アカウント自身の無効化検出）で中止する。
  - name: "Administrator"
    label: "Administrator のプロパティ"
    create: False
    must_change_password: False     # □
    cannot_change_password: False   # □
    password_never_expires: True    # ■（既定値は □ → シートで変更）
    account_disabled: True          # ■（既定値は □ → シートで変更）
    groups:
      - "Administrators"

  # --- Guest のプロパティ ---
  - name: "Guest"
    label: "Guest のプロパティ"
    create: False
    must_change_password: False     # □
    cannot_change_password: True    # ■
    password_never_expires: True    # ■
    account_disabled: True          # ■
    groups:
      - "Guests"

# =====================================================================
# パスワード（機密情報）
#
# 新規作成時のパスワードは以下の順で取得する（どちらの持ち方でも動く）。
#   1. local_users のレコード内の admin_password
#   2. server_admin_accounts の「ユーザー名と同じキー」
#
# !!! 重要 !!! レコード内に admin_password を持たせる場合の注意
# Playbook 側では PHASE 0 でパスワードを別変数へ退避し、以降のループ変数からは
# 取り除いている。これをしないと、タスクが失敗したときに Ansible が item を
# 丸ごとログ出力するため、実行ログに平文パスワードが残る（実際に発生した）。
# 自作タスクを追加する場合も、パスワードを含む変数をループさせないこと。
#
# 2. の server_admin_accounts は既存ロールと同じ形式:
#
#   server_admin_accounts:
#     mgvbaseadm01: "＜パスワード＞"
#     mgprtsvadm01: "＜パスワード＞"     # ← local_users の name と一致するキー
#     ...
#
# !!! 重要 !!! このファイルには server_admin_accounts を定義していない。
# 定義するとロールの defaults/main.yml より vars_files が優先され、
# 本来のパスワード定義を上書きしてしまうため。
# 以下のいずれかで渡すこと（どちらでも Playbook から参照できる）。
#   - ロールの defaults/main.yml など既存の変数ファイル
#   - Exastro の機密パラメータ / extra-vars
#     例) -e '{"server_admin_accounts":{"mgprtsvadm01":"＜パスワード＞"}}'
#
# 補足:
# - create: True のユーザーが「対象サーバーに存在しない」場合のみ必須。
#   （既に存在する場合はパスワードを変更しない: update_password=on_create）
# - 該当キーが無い場合は、1件も変更しないうちにガードで中止する。
# - パスワードを扱うタスクには no_log: true を設定しており、ログには出力されない。
# =====================================================================

# =====================================================================
# 動作オプション
# =====================================================================

# 「所属するグループ」の扱い。
# シートの指定は「追加」のみのため add 固定（既存の所属は削除しない）。
# replace にすると Users など既定の所属まで剥がれるため変更しないこと。
local_user_groups_action: "add"
