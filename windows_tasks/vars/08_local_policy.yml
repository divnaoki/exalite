# =====================================================================
# 08_ローカルグループポリシー : 変数定義
#
# Exastro のパラメータシートからは「有効」「無効」の文字列が渡る。
# （サービス無効化やWindowsUpdateの True/False とは形式が異なるので注意）
#
# ★「有効」「無効」は "ポリシー自体を有効にする/無効にする" を意味する。
#   "機能が ON になる/OFF になる" ではない点に注意。
#   例) 自動更新を構成する = 無効 → 自動更新は行われなくなる
#
# 受け付ける値: 「有効」「有効にする」「無効」「無効にする」（前後の空白は無視）
# それ以外の値が渡った場合は [GUARD] タスクで中止する。
# =====================================================================

# ---------------------------------------------------------------------
# コンピューターの構成 > 管理用テンプレート
#   > Windowsコンポーネント > Windows Update
#   > 自動更新を構成する
#
#   無効 → NoAutoUpdate = 1（自動更新を行わない）＋ AUOptions を削除
#   有効 → NoAutoUpdate = 0 ＋ AUOptions = lp_au_options
# ---------------------------------------------------------------------
lp_configure_auto_update: "無効"

# 「自動更新を構成する」を有効にする場合の動作モード（有効のときのみ使用）
#   2=通知のみ / 3=自動DLしインストールを通知 / 4=自動DLしインストール日時指定 / 5=ローカル管理者に許可
lp_au_options: 3

# ---------------------------------------------------------------------
# コンピューターの構成 > 管理用テンプレート
#   > Windowsコンポーネント > リモートデスクトップサービス
#   > リモートデスクトップセッションホスト > 接続
#   > リモートデスクトップサービスユーザーに対して
#     リモートデスクトップサービスセッションを1つに制限する
#
#   無効 → fSingleSessionPerUser = 0（複数セッションを許可）
#   有効 → fSingleSessionPerUser = 1（1セッションに制限）
# ---------------------------------------------------------------------
lp_rds_single_session: "無効"

# ---------------------------------------------------------------------
# コンピューターの構成 > 管理用テンプレート
#   > Windowsコンポーネント > リモートデスクトップサービス
#   > リモートデスクトップセッションホスト > セッションの時間制限
#   > アクティブでアイドル状態になっている
#     リモートデスクトップサービスセッションの制限時間を設定する
#
#   有効 → MaxIdleTime = lp_rds_idle_time_limit_minutes × 60000 (ミリ秒)
#   無効 → MaxIdleTime = 0（制限しない）
# ---------------------------------------------------------------------
lp_rds_idle_time_limit: "有効"

# 上記を有効にする場合の「アイドルセッションの制限」
#   ※ここは有効/無効ではなく時間の指定。Exastro からは「5分」のように
#     単位付きの文字列で渡るため、Playbook 側で「分」を除去して数値化する。
#     全角数字（５分）や空白（5 分）が混じっても解釈できる。
#   ※「分」以外の単位（1時間 / 1日 など）は [GUARD] で中止する。
#     時間で指定したい場合は分に換算して記載すること（1時間 -> 60分）。
#   gpedit.msc の選択肢: 1分 / 5分 / 10分 / 15分 / 30分 / 60分 / 120分 / 180分 / 300分 / 1440分
lp_rds_idle_time_limit_minutes: "5分"
