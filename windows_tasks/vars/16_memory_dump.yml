# =====================================================================
# 16_メモリダンプ設定 : 変数定義
#
# パラメータシートの対応:
#   起動と回復 > デバッグ情報の書き込み -> カーネルダンプ
#
# Exastro からは画面表示に近い日本語ラベルが渡る想定。
# Playbook 側でレジストリ値（CrashDumpEnabled）へ変換する。
#
# 表記ゆれ（「カーネルダンプ」「カーネル メモリ ダンプ」「カーネルメモリダンプ」、
# 全角/半角カッコ、空白の有無、数値指定）はすべて吸収する。
# =====================================================================

# デバッグ情報の書き込み
dump_write_debug_info: "カーネルダンプ"

# =====================================================================
# パラメータシートの値 -> CrashDumpEnabled への変換表
#
# キーは「正規化後」の文字列。正規化では以下を行うため、
# 「カーネル メモリ ダンプ」「カーネルメモリダンプ」「カーネルダンプ」は
# いずれも "カーネルダンプ" として扱われる。
#   ・空白（半角/全角）を除去
#   ・全角カッコ（）を半角 () に統一
#   ・「メモリ」を除去（"〜メモリダンプ" と "〜ダンプ" を同一視するため）
#   ・英字を大文字化
#
# ※ この表にない値が渡された場合は、レジストリを変更せずに中止する。
# =====================================================================
dump_type_map:
  "なし": 0
  "NONE": 0
  "完全ダンプ": 1
  "カーネルダンプ": 2
  "小ダンプ": 3
  "小ダンプ(256KB)": 3
  "自動ダンプ": 7
  # 数値でそのまま渡された場合
  "0": 0
  "1": 1
  "2": 2
  "3": 3
  "7": 7

# 表示用（取得した CrashDumpEnabled を人が読める形にする）
dump_type_labels:
  0: "なし"
  1: "完全メモリダンプ"
  2: "カーネルメモリダンプ"
  3: "小メモリダンプ(256KB)"
  7: "自動メモリダンプ"

# 【補足】
# カーネルメモリダンプの出力にはページファイルが必要。
# ページファイルが小さい / 無効だとクラッシュ時にダンプが作成されないため、
# 別途「システム管理サイズ」等で確保されていることを確認すること。
# 本 Playbook はページファイルの設定は変更しない。
