# =====================================================================
# 07_サービス無効化 : 変数定義
#
# Exastro のパラメータシートは「対象サービス名レコード」に対して
# False が定義される想定。1レコード = 1サービスとして下記の形で渡す。
#
#   target_services:
#     - name: "Spooler"      # サービス名（表示名ではなく "サービス名"）
#       enabled: False       # False = 無効化する
#
# ※ 本Playbookは「無効化専用」。
#   enabled が True のレコードは何もせずスキップする（有効化はしない）。
#   値は Exastro から文字列で渡るため Playbook 側で `| bool` 評価している。
# =====================================================================

# !!! 重要 !!!
# ここは「本業のパラメータシートで確定した対象サービス名」に置き換えること。
#
# 【対象選定の方針】
# 他サービスに影響を与えないものだけを対象にする。
# 追加前に必ず依存関係を確認し、Dependents（自分に依存しているサービス）が
# 空であることを確かめること。確認コマンド:
#   Get-Service <名前> | Select-Object -ExpandProperty DependentServices
#
# 【実績のある注意点】
# 検証環境で Spooler / RemoteRegistry / WerSvc / WpnService を無効化したところ、
# 直後は正常だったが以後 WinRM のシェル生成が RPC エラーで失敗し接続不能になった。
# 稼働中のサービスを新たに追加する場合は、まず1件ずつ実行し
# [CHECK] タスクで接続が維持されることを確認しながら進めること。
#
# 本業から連携された無効化対象14件。
# 全て検証機(Server 2022)に実在することを確認済み。
# 「name」はサービス名、コメントは services.msc の表示名。
target_services:
  - name: "bthserv"              # Bluetooth サポート サービス
    enabled: False
  - name: "vmictimesync"         # Hyper-V Time Synchronization Service
    enabled: False
  - name: "wlidsvc"              # Microsoft Account Sign-in Assistant
    enabled: False
  - name: "PcaSvc"               # Program Compatibility Assistant Service
    enabled: False
  - name: "QWAVE"                # Quality Windows Audio Video Experience
    enabled: False
  - name: "WiaRpc"               # Still Image Acquisition Events
    enabled: False
  - name: "TabletInputService"   # Touch Keyboard and Handwriting Panel Service
    enabled: False
  - name: "Audiosrv"             # Windows Audio
    enabled: False
  - name: "AudioEndpointBuilder" # Windows Audio Endpoint Builder
    enabled: False
  - name: "WbioSrvc"             # Windows Biometric Service
    enabled: False
  - name: "stisvc"               # Windows Image Acquisition (WIA)
    enabled: False
  - name: "FrameServer"          # Windows カメラ フレーム サーバー
    enabled: False
  - name: "FrameServerMonitor"   # Windows カメラ フレーム サーバー モニター
    enabled: False
  # !!! 注意 !!! WpnService は 2026-08-05 の接続断事故で無効化した4サービスの1つ。
  # 原因は未特定のまま。実行時は復旧手段（RDP/コンソール）を確保してから行うこと。
  - name: "WpnService"           # Windows プッシュ通知システム サービス
    enabled: False

# 依存関係メモ（実機確認済み）:
#   AudioEndpointBuilder <- Audiosrv が依存（両方とも対象なので問題なし）
#   その他13件は Dependents が空＝他サービスへの影響なし
#   DependsOn 側に RpcSs 等があるが、これは「対象が依存している先」なので無効化の影響外

# =====================================================================
# 保護対象サービス（無効化を禁止するガードリスト）
#
# ここに含まれるサービスが target_services に指定された場合、
# 1台も変更せずに PHASE 2 の手前で異常終了する。
# WinRM / RpcSs / Winmgmt を無効化すると Ansible の接続自体が失われ、
# 復旧に仮想マシンのコンソール操作が必要になるため。
# =====================================================================
protected_services:
  - "WinRM"                  # Ansible の接続経路そのもの
  - "RpcSs"                  # Remote Procedure Call（大半のサービスが依存）
  - "RpcEptMapper"
  - "DcomLaunch"
  - "Winmgmt"                # WMI（Ansible のモジュールが使用）
  - "EventLog"
  - "CryptSvc"
  - "BFE"                    # Base Filtering Engine
  - "mpssvc"                 # Windows Defender Firewall
  - "Dnscache"
  - "Dhcp"
  - "nsi"
  - "netprofm"
  - "NlaSvc"
  - "LanmanWorkstation"
  - "LanmanServer"
  - "SamSs"
  - "gpsvc"
  - "ProfSvc"
  - "PlugPlay"
  - "Power"
  - "BrokerInfrastructure"
  - "KeyIso"
  - "Schedule"
