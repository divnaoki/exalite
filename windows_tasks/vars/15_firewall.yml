# =====================================================================
# 15_Windows ファイアウォール : 変数定義
#
# パラメータシートの行と変数を1対1で対応させている。
# 値は画面表示どおりの日本語ラベルをそのまま記載する
# （Playbook 側で PowerShell の値 True / Block / Allow / Any へ変換する）。
#
# 表記ゆれ（全角/半角カッコ、空白、「（既定）」「（推奨）」の有無、
# TRUE/true、英語表記の Block / Allow / Any）はすべて吸収する。
# =====================================================================

# --- ドメイン プロファイル ---
fw_domain_enabled: "有効（推奨）"           # ファイアウォールの状態
fw_domain_inbound: "ブロック（既定）"       # 受信接続
fw_domain_outbound: "許可（既定）"          # 送信接続

# --- プライベート プロファイル ---
fw_private_enabled: "有効（推奨）"          # ファイアウォールの状態
fw_private_inbound: "ブロック（既定）"      # 受信接続
fw_private_outbound: "許可（既定）"         # 送信接続

# --- パブリック プロファイル ---
fw_public_enabled: "有効（推奨）"           # ファイアウォールの状態
fw_public_inbound: "ブロック（既定）"       # 受信接続
fw_public_outbound: "許可（既定）"          # 送信接続

# --- 受信の規則（下部の fw_rules で指定した規則に適用）---
fw_rule_profile: "すべて"   # プロファイル
fw_rule_enabled: "TRUE"     # 有効

# =====================================================================
# 上記のプロファイル別変数をまとめたもの（Playbook が参照する）
#
# 変数を増減する必要はない。プロファイルごとの設定値は上の
# fw_<プロファイル>_* を書き換えること。
# =====================================================================
fw_profile_settings:
  - name: "Domain"
    label: "ドメイン プロファイル"
    enabled: "{{ fw_domain_enabled }}"
    inbound: "{{ fw_domain_inbound }}"
    outbound: "{{ fw_domain_outbound }}"
  - name: "Private"
    label: "プライベート プロファイル"
    enabled: "{{ fw_private_enabled }}"
    inbound: "{{ fw_private_inbound }}"
    outbound: "{{ fw_private_outbound }}"
  - name: "Public"
    label: "パブリック プロファイル"
    enabled: "{{ fw_public_enabled }}"
    inbound: "{{ fw_public_inbound }}"
    outbound: "{{ fw_public_outbound }}"

# =====================================================================
# 有効にする受信の規則（個別指定）
#
# グループ単位ではなく、対象の規則だけを名前で指定する。
# name は Get-NetFirewallRule の Name（規則名）。表示名（DisplayName）は
# OS の言語で変わるが規則名は変わらないため、規則名で指定する。
# label は確認用のコメントで、処理には使わない。
#
# ※ 対象サーバーに存在しない規則はエラーにせずスキップし、最後に報告する。
# =====================================================================
fw_rules:
  - name: "FPS-ICMP4-ERQ-In"
    label: "ファイルとプリンターの共有 (エコー要求 - ICMPv4 受信)"

# =====================================================================
# パラメータシートの値 -> PowerShell の値 への変換表
#
# キーは「正規化後」の文字列。正規化では以下を行うため、
# 「有効（推奨）」「有効(推奨)」「有効」はいずれも "有効" として扱われる。
#   ・空白（半角/全角）を除去
#   ・全角カッコ（）を半角 () に統一
#   ・「(既定)」「(推奨)」を除去
#   ・英字を大文字化（TRUE / BLOCK など英語表記にも対応するため）
#
# ※ この表にない値が渡された場合は、1件も変更しないうちに中止する。
# =====================================================================

# ファイアウォールの状態 / 規則の有効
fw_state_map:
  "有効": True
  "無効": False
  "TRUE": True
  "FALSE": False

# 受信接続 / 送信接続
# ※「すべての接続をブロック」は DefaultInboundAction ではなく別の設定
#   （受信規則を適用しない）のため、この表には含めていない。
fw_action_map:
  "ブロック": "Block"
  "許可": "Allow"
  "BLOCK": "Block"
  "ALLOW": "Allow"

# 受信の規則のプロファイル
fw_profile_map:
  "すべて": "Any"
  "ドメイン": "Domain"
  "プライベート": "Private"
  "パブリック": "Public"
  "ANY": "Any"
  "DOMAIN": "Domain"
  "PRIVATE": "Private"
  "PUBLIC": "Public"
