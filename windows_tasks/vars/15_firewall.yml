# =====================================================================
# 15_Windows ファイアウォール : 変数定義
#
# パラメータシートの対応（基本規定・推奨値）:
#   ドメイン/プライベート/パブリック プロファイル
#     ファイアウォールの状態 -> 有効（推奨）
#     受信接続               -> ブロック（既定）
#     送信接続               -> 許可（既定）
#   受信の規則 > ファイルとプリンターの共有
#     プロファイル           -> すべて
#     有効                   -> TRUE
#
# Exastro からは文字列で渡るため、真偽値は `| bool` を通して評価する。
# =====================================================================

# --- 3プロファイル共通の設定 ---
# 対象プロファイル（ドメイン / プライベート / パブリック）
fw_profiles:
  - "Domain"
  - "Private"
  - "Public"

fw_enabled: True             # ファイアウォールの状態: 有効（推奨）
fw_inbound_action: "Block"   # 受信接続: ブロック（既定）
fw_outbound_action: "Allow"  # 送信接続: 許可（既定）

# --- 受信の規則「ファイルとプリンターの共有」---
# 規則の指定にはグループ ID を使う。
# グループ ID は "@<DLL名>,-<リソースID>" という Windows の間接文字列参照で、
# 日本語環境では「ファイルとプリンターの共有」、英語環境では
# "File and Printer Sharing" と表示される。表示名は OS の言語で変わるが
# この ID は変わらないため、規則グループを確実に指定できる。
# ※ グループには複数の規則（SMB / NetBIOS / ICMP / スプーラー等）が含まれる。
#   個別の規則名を書き並べる必要はなく、グループ配下すべてが対象になる。
fw_rule_group: '@FirewallAPI.dll,-28502'

fw_rule_profile: "Any"   # プロファイル: すべて
fw_rule_enabled: True    # 有効: TRUE
