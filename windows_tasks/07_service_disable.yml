---
# =====================================================================
# 07_サービス無効化
#
# 構成ルール:
#   PHASE 0  保護対象サービスが指定されていないかを検証（変更前に停止）
#   PHASE 1  変更前の設定情報を取得（必ず取得）
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を再取得して確認
#
# 前提:
#   - 本Playbookは「無効化専用」。有効化は一切行わない。
#   - Exastro のパラメータシートから対象サービス名レコードに False が渡る。
#   - enabled が True のレコードは何もせずスキップする。
#   - 値は文字列で渡るため判定は全て `| bool` を通している。
#
# シェル実行は win_powershell ではなく win_shell を使用（本業環境に合わせる）。
# サービス操作は専用モジュール win_service を使用（前後取得と when は同様に実施）。
# =====================================================================
- name: "07_サービス無効化"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/07_service_disable.yml

  tasks:
    # =================================================================
    # PHASE 0: 保護対象サービスのガード（変更を1件も行う前に検証）
    # =================================================================
    - name: "[GUARD] 保護対象サービスが指定されていないか検証"
      ansible.builtin.assert:
        that:
          - >-
            (target_services | map(attribute='name') | map('lower') | list
             | select('in', protected_services | map('lower') | list)
             | list | length) == 0
        success_msg: "保護対象サービスの指定はありません。処理を継続します。"
        fail_msg: >-
          保護対象サービスが指定されています:
          {{ target_services | map(attribute='name') | map('lower') | list
             | select('in', protected_services | map('lower') | list) | list }}
          — これらを無効化すると Ansible の接続または OS の動作が失われるため中止しました。

    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] 対象サービスの現在状態を取得"
      ansible.windows.win_shell: |
        $names = '{{ target_services | map(attribute="name") | list | to_json }}' | ConvertFrom-Json

        # 依存サービスを再帰的に列挙する（直接の依存だけでは連鎖停止を検知できないため）
        function Get-AllDependents($Service) {
          $acc = New-Object System.Collections.Generic.HashSet[string]
          $stack = New-Object System.Collections.Stack
          $stack.Push($Service)
          while ($stack.Count -gt 0) {
            $cur = $stack.Pop()
            foreach ($d in $cur.DependentServices) {
              if ($acc.Add($d.Name)) { $stack.Push($d) }
            }
          }
          return @($acc)
        }

        $list = @()
        foreach ($n in $names) {
          $s = Get-Service -Name $n -ErrorAction SilentlyContinue
          if ($s) {
            $list += [PSCustomObject][ordered]@{
              Name        = $n
              Exists      = $true
              DisplayName = $s.DisplayName
              StartType   = $s.StartType.ToString()
              Status      = $s.Status.ToString()
              # 実行中でも停止を受け付けないサービスがある（例: TabletInputService）。
              # 判別せずに stop すると「Cannot stop ... service」で失敗するため必ず見る。
              CanStop     = [bool]$s.CanStop
              Dependents  = @($s.DependentServices | ForEach-Object { $_.Name })
              AllDependents = @(Get-AllDependents $s)
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name        = $n
              Exists      = $false
              DisplayName = $null
              StartType   = $null
              Status      = $null
              CanStop     = $false
              Dependents  = @()
              AllDependents = @()
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: svc_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        svc_before: "{{ svc_before_raw.stdout | from_json }}"

    - name: "[BEFORE] サービス名で引ける辞書を作成"
      ansible.builtin.set_fact:
        svc_before_map: "{{ dict(svc_before | map(attribute='Name') | zip(svc_before)) }}"

    - name: "[BEFORE] 現在状態を表示"
      ansible.builtin.debug:
        var: svc_before

    # --- 依存関係ガード（PHASE 2 の手前で検証。1件も変更しない）---
    # 名前ガードだけでは「保護対象サービスが無効化対象に依存している」ケースを
    # 検知できない。無効化すると連鎖で保護対象まで停止し接続を失うため、
    # 再帰的に列挙した依存サービスに保護対象が含まれていないか検証する。
    - name: "[GUARD] 無効化対象に保護対象サービスが依存していないか検証"
      ansible.builtin.assert:
        that:
          - >-
            (svc_before | selectattr('Exists') | map(attribute='AllDependents') | flatten
             | map('lower') | list
             | select('in', protected_services | map('lower') | list)
             | list | length) == 0
        success_msg: "保護対象サービスが依存している対象はありません。処理を継続します。"
        fail_msg: >-
          無効化対象に保護対象サービスが依存しています:
          {{ svc_before | selectattr('Exists') | map(attribute='AllDependents') | flatten
             | map('lower') | list
             | select('in', protected_services | map('lower') | list) | unique | list }}
          — 無効化すると連鎖停止で接続を失うため中止しました。

    - name: "[BEFORE] 処理内容の内訳を表示"
      ansible.builtin.debug:
        msg:
          - "無効化する           : {{ target_services | map(attribute='name') | select('in', svc_before | selectattr('Exists') | selectattr('StartType', 'ne', 'Disabled') | map(attribute='Name') | list) | list }}"
          - "既に無効のためスキップ : {{ svc_before | selectattr('Exists') | selectattr('StartType', 'eq', 'Disabled') | map(attribute='Name') | list }}"
          - "存在しないためスキップ : {{ svc_before | rejectattr('Exists') | map(attribute='Name') | list }}"

    # =================================================================
    # PHASE 2: 変更（無効化指定 かつ 存在する かつ まだ無効でない場合のみ実行）
    # =================================================================
    # 「スタートアップの種類=無効」と「停止」は必ず分けて実行する。
    # 1タスクで両方指定すると、停止できないサービス（CanStop=false）で
    # タスク全体が失敗し、起動種別の変更まで巻き添えで適用されなくなるため。
    - name: "スタートアップの種類を「無効」に設定"
      ansible.windows.win_service:
        name: "{{ item.name }}"
        start_mode: disabled
      loop: "{{ target_services }}"
      loop_control:
        label: "{{ item.name }} (現在: {{ svc_before_map[item.name].StartType | default('存在しない') }})"
      when:
        # 無効化専用: True のレコードは有効化せず何もしない
        - not (item.enabled | default(false) | bool)
        - svc_before_map[item.name].Exists | bool
        - svc_before_map[item.name].StartType != 'Disabled'

    # 停止は「実行中」かつ「停止を受け付ける」サービスに限定する。
    # TabletInputService のように実行中でも CanStop=false のものがあり、
    # 停止を試みると "Cannot stop <name> service on computer '.'" で失敗する。
    # これらは起動種別を無効にしたうえで、次回再起動時に停止する。
    - name: "サービスを停止（停止可能なもののみ）"
      ansible.windows.win_service:
        name: "{{ item.name }}"
        state: stopped
        force_dependent_services: true
      loop: "{{ target_services }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - not (item.enabled | default(false) | bool)
        - svc_before_map[item.name].Exists | bool
        - svc_before_map[item.name].Status == 'Running'
        - svc_before_map[item.name].CanStop | bool

    # --- 無効化直後の接続性確認 ---
    # サービス無効化の影響で WinRM のシェル生成が壊れるケースがあるため、
    # 実行中にその場で検知する（次回実行まで気づけない事態を防ぐ）。
    # 接続断は Playbook 完了後ではなくこの時点で失敗として顕在化させる。
    - name: "[CHECK] 無効化後も WinRM 接続が維持されているか確認"
      ansible.windows.win_ping:
      register: conn_check
      retries: 3
      delay: 10
      until: conn_check is succeeded

    # =================================================================
    # PHASE 3: 変更後の設定情報を再取得（確認）
    # =================================================================
    - name: "[AFTER] 対象サービスの状態を再取得"
      ansible.windows.win_shell: |
        $names = '{{ target_services | map(attribute="name") | list | to_json }}' | ConvertFrom-Json

        # 依存サービスを再帰的に列挙する（直接の依存だけでは連鎖停止を検知できないため）
        function Get-AllDependents($Service) {
          $acc = New-Object System.Collections.Generic.HashSet[string]
          $stack = New-Object System.Collections.Stack
          $stack.Push($Service)
          while ($stack.Count -gt 0) {
            $cur = $stack.Pop()
            foreach ($d in $cur.DependentServices) {
              if ($acc.Add($d.Name)) { $stack.Push($d) }
            }
          }
          return @($acc)
        }

        $list = @()
        foreach ($n in $names) {
          $s = Get-Service -Name $n -ErrorAction SilentlyContinue
          if ($s) {
            $list += [PSCustomObject][ordered]@{
              Name        = $n
              Exists      = $true
              DisplayName = $s.DisplayName
              StartType   = $s.StartType.ToString()
              Status      = $s.Status.ToString()
              # 実行中でも停止を受け付けないサービスがある（例: TabletInputService）。
              # 判別せずに stop すると「Cannot stop ... service」で失敗するため必ず見る。
              CanStop     = [bool]$s.CanStop
              Dependents  = @($s.DependentServices | ForEach-Object { $_.Name })
              AllDependents = @(Get-AllDependents $s)
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name        = $n
              Exists      = $false
              DisplayName = $null
              StartType   = $null
              Status      = $null
              CanStop     = $false
              Dependents  = @()
              AllDependents = @()
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: svc_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        svc_after: "{{ svc_after_raw.stdout | from_json }}"

    - name: "[AFTER] サービス名で引ける辞書を作成"
      ansible.builtin.set_fact:
        svc_after_map: "{{ dict(svc_after | map(attribute='Name') | zip(svc_after)) }}"

    - name: "[AFTER] 変更後の状態を表示"
      ansible.builtin.debug:
        var: svc_after

    # スタートアップの種類が「無効」であることを必須条件とする。
    # 停止状態は「停止を受け付けるサービス」に対してのみ必須とし、
    # CanStop=false のものは実行中のままでも合格とする（再起動で停止するため）。
    - name: "[AFTER] 無効化されたことを確認"
      ansible.builtin.assert:
        that:
          - svc_after_map[item.name].StartType == 'Disabled'
          - >-
            svc_after_map[item.name].Status == 'Stopped'
            or (not (svc_after_map[item.name].CanStop | bool))
        success_msg: >-
          {{ item.name }} : 無効化を確認しました
          (StartType={{ svc_after_map[item.name].StartType }},
          Status={{ svc_after_map[item.name].Status }})。
        fail_msg: >-
          {{ item.name }} : 無効化されていません
          (StartType={{ svc_after_map[item.name].StartType }},
          Status={{ svc_after_map[item.name].Status }},
          CanStop={{ svc_after_map[item.name].CanStop }})
      loop: "{{ target_services }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - not (item.enabled | default(false) | bool)
        - svc_after_map[item.name].Exists | bool

    - name: "[AFTER] 停止できず実行中のまま残ったサービスを報告"
      ansible.builtin.debug:
        msg: >-
          以下のサービスは停止を受け付けないため、スタートアップの種類のみ「無効」に設定しました。
          プロセスは次回の再起動まで実行されたままになります:
          {{ svc_after | selectattr('Exists') | selectattr('Status', 'eq', 'Running')
             | map(attribute='Name') | list }}
      when: >-
        (svc_after | selectattr('Exists') | selectattr('Status', 'eq', 'Running')
         | list | length) > 0

    - name: "[AFTER] 存在しなかったサービスを報告"
      ansible.builtin.debug:
        msg: >-
          以下のサービスは対象サーバーに存在しないためスキップしました:
          {{ svc_after | rejectattr('Exists') | map(attribute='Name') | list }}
      when: (svc_after | rejectattr('Exists') | list | length) > 0
