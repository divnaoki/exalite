---
# =====================================================================
# [収集] (6) コンピューターの管理 / ローカルユーザーとグループ
#        -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_computermgmt__<ホスト名>
# 項目名は s06_computermgmt_user_<ユーザー名>_<項目>。
#
# ※ パスワードは取得も出力もしない。
# =====================================================================
- name: "[収集] (6) コンピューターの管理（ローカルユーザー）"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/sections.yml
    - ../vars/11_local_users.yml

  vars:
    sec: "{{ param_sections.computermgmt }}"
    sec_menu: "{{ param_section_menus.computermgmt | default(param_section_menu_default) }}"
    var_key: "collected_computermgmt__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"

  tasks:
    - name: "現在のローカルユーザー設定を取得"
      ansible.windows.win_shell: |
        $names = '{{ local_users | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $list = @()
        foreach ($n in $names) {
          $obj = $null
          $exists = $false
          try {
            $obj = [ADSI]("WinNT://./" + $n + ",user")
            # プロパティ参照だけでは存在判定にならないため RefreshCache() を使う
            $obj.psbase.RefreshCache()
            $exists = $true
          } catch { $exists = $false; $obj = $null }
          if ($exists -and ($null -eq $obj.UserFlags.Value)) { $exists = $false; $obj = $null }

          if ($exists) {
            $flags = [int]$obj.UserFlags.Value
            $mustChange = $false
            try { $mustChange = ([int]$obj.PasswordExpired.Value -eq 1) } catch { $mustChange = $false }
            $groups = @()
            try {
              $groups = @($obj.psbase.Invoke("Groups") | ForEach-Object {
                $_.GetType().InvokeMember("Name", "GetProperty", $null, $_, $null)
              })
            } catch { $groups = @() }
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $true
              MustChangePassword   = $mustChange
              CannotChangePassword = [bool]($flags -band 0x0040)
              PasswordNeverExpires = [bool]($flags -band 0x10000)
              Disabled             = [bool]($flags -band 0x0002)
              Groups               = $groups
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $false
              MustChangePassword = $false; CannotChangePassword = $false
              PasswordNeverExpires = $false; Disabled = $false; Groups = @()
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 5
      args:
        executable: powershell
      changed_when: false
      register: users_raw

    - name: "取得結果をユーザー名で引ける辞書に格納"
      ansible.builtin.set_fact:
        users_map: >-
          {{ dict((users_raw.stdout | from_json) | map(attribute='Name')
             | zip(users_raw.stdout | from_json)) }}

    # ユーザー × 項目 = 1レコード。
    # 存在しないユーザーは「存在」のみ出力し、他の項目は出力しない
    # （未取得と FALSE を取り違えないようにするため）。
    - name: "項目を組み立て"
      ansible.builtin.set_fact:
        users_rows: >-
          {{ users_rows | default([])
             + [ { 'key': (k ~ '_exists'),
                   'item': (base ~ ' / ユーザーの存在'),
                   'value': ('TRUE' if (u.Exists | bool) else 'FALSE') } ]
             + ([ { 'key': (k ~ '_must_change_password'),
                    'item': (base ~ ' / ユーザーは次回ログオン時にパスワードの変更が必要'),
                    'value': ('TRUE' if (u.MustChangePassword | bool) else 'FALSE') },
                  { 'key': (k ~ '_cannot_change_password'),
                    'item': (base ~ ' / ユーザーはパスワードを変更できない'),
                    'value': ('TRUE' if (u.CannotChangePassword | bool) else 'FALSE') },
                  { 'key': (k ~ '_password_never_expires'),
                    'item': (base ~ ' / パスワードを無期限にする'),
                    'value': ('TRUE' if (u.PasswordNeverExpires | bool) else 'FALSE') },
                  { 'key': (k ~ '_account_disabled'),
                    'item': (base ~ ' / アカウントを無効にする'),
                    'value': ('TRUE' if (u.Disabled | bool) else 'FALSE') },
                  { 'key': (k ~ '_groups'),
                    'item': (base ~ ' / 所属するグループ'),
                    'value': (u.Groups | join(', ')) } ]
                if (u.Exists | bool) else []) }}
      vars:
        k: "{{ sec.prefix }}_user_{{ item.name | regex_replace('[^0-9a-zA-Z]', '_') }}"
        base: "ローカルユーザーとグループ / {{ item.name }}"
        u: "{{ users_map[item.name] }}"
      loop: "{{ local_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        users_record: >-
          {{ { 'menu': sec_menu,
               'host_name': inventory_hostname,
               'section': ('(' ~ sec.no ~ ') ' ~ sec.name),
               'rows': users_rows } }}

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/{{ sec.prefix }}_users_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: users_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: users_record
