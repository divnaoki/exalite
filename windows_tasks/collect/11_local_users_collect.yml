---
# =====================================================================
# [収集] ローカルユーザー設定情報
#
# 対象は「サーバー上に存在する全ローカルユーザー」。
# 変数で対象ユーザーを指定するのではなく、ADSI(WinNT) で列挙する。
#
# 取得した内容はユーザー名をキーにした 1 つの変数へまとめ、
# パラメータシート登録用ファイルへ local_users_info として JSON で出力する。
#
#   local_users_info: {"Administrator": {"name": "Administrator",
#                                        "must_change_password": false,
#                                        "cannot_change_password": false,
#                                        "password_never_expires": true,
#                                        "disabled": false,
#                                        "groups": ["Administrators"]}, ... }
#
# ※ パスワードは取得も出力もしない。
# =====================================================================
- name: "11_ローカルユーザー設定情報収集"
  hosts: windows
  gather_facts: false

  tasks:
    - name: ローカルユーザー設定情報取得（Before）
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'

        # ローカルユーザーの列挙（SchemaClassName が user のものだけ）
        $computer = [ADSI]("WinNT://" + $env:COMPUTERNAME + ",computer")
        $users = @($computer.psbase.Children | Where-Object { $_.SchemaClassName -eq 'user' })

        $list = @()
        foreach ($u in $users) {
          # UserFlags のビットで各チェックボックスの状態を判定する
          #   0x0002 = UF_ACCOUNTDISABLE      アカウントを無効にする
          #   0x0040 = UF_PASSWD_CANT_CHANGE  ユーザーはパスワードを変更できない
          #   0x10000 = UF_DONT_EXPIRE_PASSWD パスワードを無期限にする
          $flags = 0
          try { $flags = [int]$u.UserFlags.Value } catch { $flags = 0 }

          # 次回ログオン時のパスワード変更要求は PasswordExpired で見る
          $mustChange = $false
          try { $mustChange = ([int]$u.PasswordExpired.Value -eq 1) } catch { $mustChange = $false }

          $groups = @()
          try {
            $groups = @($u.psbase.Invoke("Groups") | ForEach-Object {
              $_.GetType().InvokeMember("Name", "GetProperty", $null, $_, $null)
            })
          } catch { $groups = @() }

          $list += [PSCustomObject][ordered]@{
            Name                 = [string]$u.Name.Value
            MustChangePassword   = $mustChange
            CannotChangePassword = [bool]($flags -band 0x0040)
            PasswordNeverExpires = [bool]($flags -band 0x10000)
            Disabled             = [bool]($flags -band 0x0002)
            Groups               = @($groups)
          }
        }
        ConvertTo-Json -InputObject @($list | Sort-Object -Property Name) -Compress -Depth 5
      args:
        executable: powershell
      changed_when: false
      register: localuser_info

    - name: パラメータシート登録用形式設定
      set_fact:
        localuser_raw: >-
          {{ localuser_raw | default({}) | combine({ item.Name: {
               'name': item.Name,
               'must_change_password': item.MustChangePassword,
               'cannot_change_password': item.CannotChangePassword,
               'password_never_expires': item.PasswordNeverExpires,
               'disabled': item.Disabled,
               'groups': item.Groups
             } }) }}
      loop: "{{ localuser_info.stdout | from_json }}"
      loop_control:
        label: "{{ item.Name }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ localuser_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/local_users"
        block: |
          local_users_info: {{ localuser_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
