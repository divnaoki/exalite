---
# =====================================================================
# [収集] (8) 役割と機能 -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_feature__<ホスト名>
# 項目名は s08_feature_<機能名>、値は TRUE / FALSE / 存在しない。
# =====================================================================
- name: "[収集] (8) 役割と機能"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/sections.yml
    - ../vars/10_server_features.yml

  vars:
    sec: "{{ param_sections.feature }}"
    sec_menu: "{{ param_section_menus.feature | default(param_section_menu_default) }}"
    var_key: "collected_feature__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"

  tasks:
    - name: "現在の役割と機能を取得"
      ansible.windows.win_shell: |
        $names = '{{ target_features | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        Import-Module ServerManager -ErrorAction SilentlyContinue
        # 存在しない名前を -Name で渡すと非終了エラーになるため全件取得してから引く
        $all = @{}
        foreach ($f in (Get-WindowsFeature)) { $all[$f.Name.ToLower()] = $f }
        $list = @()
        foreach ($n in $names) {
          $key = $n.ToLower()
          if ($all.ContainsKey($key)) {
            $f = $all[$key]
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $true
              InstallState = $f.InstallState.ToString(); Installed = [bool]$f.Installed
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $false; InstallState = $null; Installed = $false
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: feat_raw

    - name: "取得結果を機能名で引ける辞書に格納"
      ansible.builtin.set_fact:
        feat_map: >-
          {{ dict((feat_raw.stdout | from_json) | map(attribute='Name')
             | zip(feat_raw.stdout | from_json)) }}

    # 機能1つ = 1レコード。項目名は vars/10_server_features.yml の label（日本語）を使う。
    - name: "項目を組み立て"
      ansible.builtin.set_fact:
        feat_rows: >-
          {{ feat_rows | default([]) + [ {
               'key': (sec.prefix ~ '_' ~ (item.name | regex_replace('[^0-9a-zA-Z]', '_'))),
               'item': ((item.label | default(item.name)) ~ ' [' ~ item.name ~ ']'),
               'value': ('存在しない' if not (feat_map[item.name].Exists | bool)
                         else ('TRUE' if (feat_map[item.name].Installed | bool) else 'FALSE'))
             } ] }}
      loop: "{{ target_features }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        feat_record: >-
          {{ { 'menu': sec_menu,
               'host_name': inventory_hostname,
               'section': ('(' ~ sec.no ~ ') ' ~ sec.name),
               'rows': feat_rows } }}

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/{{ sec.prefix }}_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: feat_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: feat_record
