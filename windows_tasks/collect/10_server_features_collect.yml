---
# =====================================================================
# [収集] 10_サーバーの役割と機能 -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_features__<ホスト名>
# 項目名は feature_<機能名> とし、値は TRUE / FALSE / 存在しない。
# =====================================================================
- name: "[収集] 10_サーバーの役割と機能"
  hosts: windows
  gather_facts: false

  vars_files:
    - ../vars/10_server_features.yml

  vars:
    var_key: "collected_features__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"

  tasks:
    - name: "現在の役割と機能を取得"
      ansible.windows.win_shell: |
        $names = '{{ target_features | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        Import-Module ServerManager -ErrorAction SilentlyContinue
        # 存在しない名前を -Name で渡すと非終了エラーになるため全件取得してから引く
        $all = @{}
        foreach ($f in (Get-WindowsFeature)) { $all[$f.Name.ToLower()] = $f }
        $list = @()
        foreach ($n in $names) {
          $key = $n.ToLower()
          if ($all.ContainsKey($key)) {
            $f = $all[$key]
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $true
              InstallState = $f.InstallState.ToString(); Installed = [bool]$f.Installed
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $false; InstallState = $null; Installed = $false
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: feat_raw

    - name: "取得結果を機能名で引ける辞書に格納"
      ansible.builtin.set_fact:
        feat_map: >-
          {{ dict((feat_raw.stdout | from_json) | map(attribute='Name')
             | zip(feat_raw.stdout | from_json)) }}

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        feat_record: >-
          {{ feat_record | default({'host_name': inventory_hostname}) | combine({
               ('feature_' ~ (item.name | regex_replace('[^0-9a-zA-Z]', '_'))):
                 ('存在しない' if not (feat_map[item.name].Exists | bool)
                  else ('TRUE' if (feat_map[item.name].Installed | bool) else 'FALSE'))
             }) }}
      loop: "{{ target_features }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/features_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: feat_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: feat_record
