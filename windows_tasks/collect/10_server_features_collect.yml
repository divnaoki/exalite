---
# =====================================================================
# [収集] 役割と機能の設定情報
#
# 対象機能は下の target_features で指定する（設定変更側の変数ファイルは参照しない）。
# 収集に必要なのは name（Get-WindowsFeature の Name）と label（画面表示名）だけ。
#
# 取得した内容を機能名をキーにした 1 つの変数へまとめ、
# パラメータシート登録用ファイルへ server_features_info として JSON で出力する。
#
#   server_features_info: {"Web-Server": {"name": "Web-Server",
#                                         "label": "Web サーバー (IIS)",
#                                         "exists": true,
#                                         "installed": false,
#                                         "install_state": "Available"}, ... }
# =====================================================================
- name: "10_役割と機能の設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    # 収集対象の役割と機能（チェックシート No.1〜31 の並び順）
    #   name  : Get-WindowsFeature の Name（表示名ではない）
    #   label : 画面表示名
    target_features:
      # --- No.1-2 ファイルサービスと記憶域サービス ---
      - {name: "FileAndStorage-Services", label: "ファイルサービスと記憶域サービス"}
      - {name: "Storage-Services",        label: "記憶域サービス"}

      # --- No.3-6 .NET Framework 3.5 ---
      - {name: "NET-Framework-Features",  label: ".NET Framework 3.5 Features"}
      - {name: "NET-Framework-Core",      label: ".NET Framework 3.5(.NET 2.0 および 3.0 を含む)"}
      - {name: "NET-HTTP-Activation",     label: "HTTP アクティブ化(3.5)"}
      - {name: "NET-Non-HTTP-Activ",      label: "非 HTTP アクティブ化(3.5)"}

      # --- No.7-15 .NET Framework 4.8 ---
      - {name: "NET-Framework-45-Features", label: ".NET Framework 4.8 Features"}
      - {name: "NET-Framework-45-Core",     label: ".NET Framework 4.8"}
      - {name: "NET-Framework-45-ASPNET",   label: "ASP.NET 4.8"}
      - {name: "NET-WCF-Services45",        label: "WCF サービス"}
      - {name: "NET-WCF-HTTP-Activation45", label: "HTTP アクティブ化(WCF)"}
      - {name: "NET-WCF-TCP-Activation45",  label: "TCP アクティブ化(WCF)"}
      - {name: "NET-WCF-TCP-PortSharing45", label: "TCP ポート共有(WCF)"}
      - {name: "NET-WCF-MSMQ-Activation45", label: "メッセージキュー(MSMQ)アクティブ化"}
      - {name: "NET-WCF-Pipe-Activation45", label: "名前付きパイプのアクティブ化"}

      # --- No.16-19 Azure Arc / Defender / SNMP ---
      # AzureArcSetup は OS のビルドによっては存在しない（exists: false になる）
      - {name: "AzureArcSetup",     label: "Azure Arc Setup"}
      - {name: "Windows-Defender",  label: "Microsoft Defender ウイルス対策"}
      - {name: "SNMP-Service",      label: "SNMP サービス"}
      - {name: "SNMP-WMI-Provider", label: "WMI SNMP プロバイダー"}

      # --- No.20-24 Windows PowerShell ---
      - {name: "PowerShellRoot",             label: "Windows PowerShell"}
      - {name: "PowerShell",                 label: "Windows PowerShell 5.1"}
      - {name: "PowerShell-V2",              label: "Windows PowerShell 2.0 エンジン"}
      - {name: "DSC-Service",                label: "Windows PowerShell Desired State Configuration Service"}
      - {name: "WindowsPowerShellWebAccess", label: "Windows PowerShell Web Access"}

      # --- No.25-28 その他の機能 ---
      - {name: "Windows-Server-Backup", label: "Windows Server バックアップ"}
      - {name: "WoW64-Support",         label: "WoW64 サポート"}
      - {name: "XPS-Viewer",            label: "XPS Viewer"}
      - {name: "System-DataArchiver",   label: "システム データ アーカイバー"}

      # --- No.29-31 リモートサーバー管理ツール ---
      - {name: "RSAT",               label: "リモートサーバー管理ツール"}
      - {name: "RSAT-Feature-Tools", label: "機能管理ツール"}
      - {name: "RSAT-SNMP",          label: "SNMP ツール"}

  tasks:
    - name: 役割と機能の設定情報取得（Before）
      ansible.windows.win_shell: |
        $namesRaw = '{{ target_features | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        Import-Module ServerManager -ErrorAction SilentlyContinue
        # 存在しない名前を -Name で渡すと非終了エラーになるため全件取得してから引く
        $all = @{}
        foreach ($f in (Get-WindowsFeature)) { $all[$f.Name.ToLower()] = $f }
        $list = @()
        foreach ($n in $names) {
          $key = $n.ToLower()
          if ($all.ContainsKey($key)) {
            $f = $all[$key]
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $true
              InstallState = $f.InstallState.ToString(); Installed = [bool]$f.Installed
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $false; InstallState = $null; Installed = $false
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: feature_info

    - name: パラメータシート登録用形式設定
      set_fact:
        feature_raw: >-
          {{ feature_raw | default({}) | combine({ item.name: {
               'name': item.name,
               'label': (item.label | default(item.name, true)),
               'exists': cur.Exists,
               'installed': cur.Installed,
               'install_state': cur.InstallState
             } }) }}
      vars:
        feat_map: >-
          {{ dict((feature_info.stdout | from_json) | map(attribute='Name')
             | zip(feature_info.stdout | from_json)) }}
        cur: "{{ feat_map[item.name] }}"
      loop: "{{ target_features }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ feature_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/server_features"
        block: |
          server_features_info: {{ feature_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
