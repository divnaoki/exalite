---
# =====================================================================
# [収集] ローカルセキュリティポリシー設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# local_policy_info として JSON で出力する。
#
# 対象（08_local_policy.yml と同じレジストリ）:
#   自動更新を構成する
#   リモートデスクトップサービスユーザーに対してセッションを1つに制限する
#   アクティブでアイドル状態のセッションの制限時間を設定する
#
# 値が null のものはポリシー未構成。
# =====================================================================
- name: "09_ローカルセキュリティポリシー設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    reg_wu_au: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    reg_ts: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

  tasks:
    - name: ローカルセキュリティポリシー設定情報取得（Before）
      ansible.windows.win_shell: |
        function Get-PolicyValue($path, $name) {
          $p = Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue
          if ($null -eq $p) { return $null }
          return [int]$p.$name
        }
        [ordered]@{
          # 値が無い = ポリシー未構成
          NoAutoUpdate          = Get-PolicyValue '{{ reg_wu_au }}' 'NoAutoUpdate'
          AUOptions             = Get-PolicyValue '{{ reg_wu_au }}' 'AUOptions'
          fSingleSessionPerUser = Get-PolicyValue '{{ reg_ts }}' 'fSingleSessionPerUser'
          MaxIdleTime           = Get-PolicyValue '{{ reg_ts }}' 'MaxIdleTime'
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: policy_info

    - name: パラメータシート登録用形式設定
      set_fact:
        policy_raw: >-
          {{ { 'no_auto_update': cur.NoAutoUpdate,
               'au_options': cur.AUOptions,
               'single_session_per_user': cur.fSingleSessionPerUser,
               'max_idle_time': cur.MaxIdleTime,
               'max_idle_time_minutes': (none if cur.MaxIdleTime is none
                                         else ((cur.MaxIdleTime | int) // 60000)) } }}
      vars:
        cur: "{{ policy_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ policy_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/local_policy"
        block: |
          local_policy_info: |
            {{ policy_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
