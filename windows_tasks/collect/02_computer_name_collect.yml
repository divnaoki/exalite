---
# =====================================================================
# [収集] コンピューター名設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# computer_name_info として JSON で出力する。
#
#   computer_name_info: {"computer_name": "WIN2022",
#                        "domain": "WORKGROUP",
#                        "part_of_domain": false}
# =====================================================================
- name: "02_コンピューター名設定情報収集"
  hosts: windows
  gather_facts: false

  tasks:
    - name: コンピューター名設定情報取得（Before）
      ansible.windows.win_shell: |
        $cs = Get-CimInstance Win32_ComputerSystem
        [ordered]@{
          ComputerName = $cs.Name
          # ドメイン参加時はドメイン名、ワークグループ時はワークグループ名が入る
          Domain       = $cs.Domain
          PartOfDomain = [bool]$cs.PartOfDomain
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: computer_info

    - name: パラメータシート登録用形式設定
      set_fact:
        computer_raw: >-
          {{ { 'computer_name': cur.ComputerName,
               'domain': cur.Domain,
               'part_of_domain': cur.PartOfDomain } }}
      vars:
        cur: "{{ computer_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ computer_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/computer_name"
        block: |
          computer_name_info: |
            {{ computer_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
