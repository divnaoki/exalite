---
# =====================================================================
# [収集] リモートデスクトップ設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# rdp_info として JSON で出力する。
#
#   rdp_info: {"allow_connections": true,
#              "require_nla": true,
#              "firewall_enabled": true}
# =====================================================================
- name: "13_リモートデスクトップ設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    reg_ts: 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
    reg_rdp: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

    # 状態を確認するファイアウォール規則（規則名 = Get-NetFirewallRule の Name）。
    # 表示名（DisplayName）は OS の言語で変わるが規則名は変わらない。
    # 全て有効なときだけ firewall_enabled が true になる。
    rdp_firewall_rules:
      - "RemoteDesktop-UserMode-In-TCP"   # TCP 3389（RDP 本体）
      - "RemoteDesktop-UserMode-In-UDP"   # UDP 3389（画面転送の高速化に使用）

  tasks:
    - name: リモートデスクトップ設定情報取得（Before）
      ansible.windows.win_shell: |
        $namesRaw = '{{ rdp_firewall_rules | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        $fw = @(Get-NetFirewallRule -Name $names -EA SilentlyContinue)
        [ordered]@{
          # fDenyTSConnections は値が反転している（0 = 接続を許可する）
          AllowConnections = ((Get-ItemProperty '{{ reg_ts }}' -Name fDenyTSConnections -EA SilentlyContinue).fDenyTSConnections -eq 0)
          RequireNLA       = ((Get-ItemProperty '{{ reg_rdp }}' -Name UserAuthentication -EA SilentlyContinue).UserAuthentication -eq 1)
          FirewallEnabled  = (($fw.Count -gt 0) -and (@($fw | Where-Object { $_.Enabled -ne 'True' }).Count -eq 0))
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: rdp_reg_info

    - name: パラメータシート登録用形式設定
      set_fact:
        rdp_raw: >-
          {{ { 'allow_connections': cur.AllowConnections,
               'require_nla': cur.RequireNLA,
               'firewall_enabled': cur.FirewallEnabled } }}
      vars:
        cur: "{{ rdp_reg_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ rdp_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/rdp"
        block: |
          rdp_info: |
            {{ rdp_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
