---
# =====================================================================
# [収集] サービス設定情報
#
# 対象サービスは ../vars/07_service_disable.yml の target_services を使う。
#
# 取得した内容をサービス名をキーにした 1 つの変数へまとめ、
# パラメータシート登録用ファイルへ service_info として JSON で出力する。
#
#   service_info: {"bthserv": {"name": "bthserv", "exists": true,
#                              "start_type": "Disabled",
#                              "status": "Stopped"}, ... }
# =====================================================================
- name: "17_サービス設定情報収集"
  hosts: windows
  gather_facts: false

  vars_files:
    - ../vars/07_service_disable.yml

  tasks:
    - name: サービス設定情報取得（Before）
      ansible.windows.win_shell: |
        $namesRaw = '{{ target_services | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        $list = @()
        foreach ($n in $names) {
          $s = Get-Service -Name $n -ErrorAction SilentlyContinue
          if ($s) {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $true
              StartType = $s.StartType.ToString(); Status = $s.Status.ToString()
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Exists = $false; StartType = $null; Status = $null
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: svc_info

    - name: パラメータシート登録用形式設定
      set_fact:
        service_raw: >-
          {{ service_raw | default({}) | combine({ item.Name: {
               'name': item.Name,
               'exists': item.Exists,
               'start_type': item.StartType,
               'status': item.Status
             } }) }}
      loop: "{{ svc_info.stdout | from_json }}"
      loop_control:
        label: "{{ item.Name }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ service_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/service"
        block: |
          service_info: {{ service_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
