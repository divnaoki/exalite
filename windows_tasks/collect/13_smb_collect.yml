---
# =====================================================================
# [収集] SMB3.0 マルチチャネル設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# smb_info として JSON で出力する。
#
#   smb_info: {"enable_multi_channel": false,
#              "disable_multi_channel_registry": 1}
#
# disable_multi_channel_registry が null のときはレジストリ値が存在しない
# （＝既定の有効状態）。
# =====================================================================
- name: "13_SMB3.0マルチチャネル設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    reg_lanman: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'

  tasks:
    - name: SMB3.0マルチチャネル設定情報取得（Before）
      ansible.windows.win_shell: |
        $c = Get-SmbServerConfiguration
        # 実体のレジストリ値は EnableMultiChannel ではなく DisableMultiChannel（名前が反転）
        $regVal = (Get-ItemProperty -Path '{{ reg_lanman }}' -Name DisableMultiChannel -EA SilentlyContinue).DisableMultiChannel
        [ordered]@{
          EnableMultiChannel      = [bool]$c.EnableMultiChannel
          Raw_DisableMultiChannel = $(if ($null -eq $regVal) { $null } else { [int]$regVal })
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: smb_conf_info

    - name: パラメータシート登録用形式設定
      set_fact:
        smb_raw: >-
          {{ { 'enable_multi_channel': cur.EnableMultiChannel,
               'disable_multi_channel_registry': cur.Raw_DisableMultiChannel } }}
      vars:
        cur: "{{ smb_conf_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ smb_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/smb"
        block: |
          smb_info: {{ smb_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
