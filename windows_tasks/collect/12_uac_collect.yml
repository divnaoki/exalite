---
# =====================================================================
# [収集] (14) ソフトウェア制御（UAC） -> パラメータシート用の変数ファイル出力
#
# 出力ファイル: {{ __conductor_workflowdir__ }}/s14_uac_<ホスト名>.yml
# 出力する変数名: collected_software__<ホスト名>
#   { menu, host_name, section, parameters } の形で出力し、
#   99_register_parameters.yml が menu × host_name でまとめて登録する。
#
# 項目名は大項目のプレフィックス（vars/sections.yml）を付けて出力する。
# 値はパラメータシートと同じ表記（画面表示のラベル）にする。
# =====================================================================
- name: "[収集] (14) ソフトウェア制御（UAC）"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/sections.yml
    - ../vars/12_uac.yml

  vars:
    sec: "{{ param_sections.software }}"
    sec_menu: "{{ param_section_menus.software | default(param_section_menu_default) }}"
    var_key: "collected_software__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"
    uac_reg_path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'

  tasks:
    - name: "現在の UAC 設定を取得"
      ansible.windows.win_shell: |
        $path = '{{ uac_reg_path }}'
        function Get-UacValue($name) {
          $p = Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue
          if ($null -eq $p) { return $null }
          return [int]$p.$name
        }
        [ordered]@{
          EnableLUA                  = Get-UacValue 'EnableLUA'
          ConsentPromptBehaviorAdmin = Get-UacValue 'ConsentPromptBehaviorAdmin'
          PromptOnSecureDesktop      = Get-UacValue 'PromptOnSecureDesktop'
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: uac_raw

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        uac_record: >-
          {{ { 'menu': sec_menu,
               'host_name': inventory_hostname,
               'section': ('(' ~ sec.no ~ ') ' ~ sec.name),
               'rows': [
                 { 'key': (sec.prefix ~ '_notification_setting'),
                   'item': 'ユーザーアカウントの設定 / コンピューターに対する変更の通知を受け取るタイミングの選択',
                   'value': level },
                 { 'key': (sec.prefix ~ '_enable_lua'),
                   'item': 'ユーザーアカウント制御（UAC）の有効',
                   'value': ('TRUE' if (cur.EnableLUA | int) == 1 else 'FALSE') }
               ] } }}
      vars:
        cur: "{{ uac_raw.stdout | from_json }}"
        # スライダーの位置（対応表にない組み合わせのときはその旨を入れる）
        level: >-
          {{ (uac_levels
              | selectattr('consent_prompt_behavior_admin', 'eq', (uac_raw.stdout | from_json).ConsentPromptBehaviorAdmin)
              | selectattr('prompt_on_secure_desktop', 'eq', (uac_raw.stdout | from_json).PromptOnSecureDesktop)
              | list | first).label
             | default('対応表にない組み合わせ', true) }}

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/{{ sec.prefix }}_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: uac_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: uac_record
