---
# =====================================================================
# [収集] ソフトウェア制御（UAC）設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# uac_info として JSON で出力する。
#
#   uac_info: {"enable_lua": 1,
#              "consent_prompt_behavior_admin": 5,
#              "prompt_on_secure_desktop": 1,
#              "notification_level": "既定 - ..."}
#
# notification_level はスライダーの位置。レジストリ値の組み合わせを
# ../vars/12_uac.yml の uac_levels で画面表示のラベルに変換している。
# =====================================================================
- name: "12_ソフトウェア制御（UAC）設定情報収集"
  hosts: windows
  gather_facts: false

  vars_files:
    - ../vars/12_uac.yml

  vars:
    uac_reg_path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'

  tasks:
    - name: ソフトウェア制御（UAC）設定情報取得（Before）
      ansible.windows.win_shell: |
        $path = '{{ uac_reg_path }}'
        function Get-UacValue($name) {
          $p = Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue
          if ($null -eq $p) { return $null }
          return [int]$p.$name
        }
        [ordered]@{
          EnableLUA                  = Get-UacValue 'EnableLUA'
          ConsentPromptBehaviorAdmin = Get-UacValue 'ConsentPromptBehaviorAdmin'
          PromptOnSecureDesktop      = Get-UacValue 'PromptOnSecureDesktop'
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: uac_reg_info

    - name: パラメータシート登録用形式設定
      set_fact:
        uac_raw: >-
          {{ { 'enable_lua': cur.EnableLUA,
               'consent_prompt_behavior_admin': cur.ConsentPromptBehaviorAdmin,
               'prompt_on_secure_desktop': cur.PromptOnSecureDesktop,
               'notification_level': level } }}
      vars:
        cur: "{{ uac_reg_info.stdout | from_json }}"
        # スライダーの位置（対応表にない組み合わせのときはその旨を入れる）
        level: >-
          {{ (uac_levels
              | selectattr('consent_prompt_behavior_admin', 'eq', (uac_reg_info.stdout | from_json).ConsentPromptBehaviorAdmin)
              | selectattr('prompt_on_secure_desktop', 'eq', (uac_reg_info.stdout | from_json).PromptOnSecureDesktop)
              | list | first).label
             | default('対応表にない組み合わせ', true) }}

    - name: 取得情報出力
      debug:
        msg: |
          "{{ uac_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/uac"
        block: |
          uac_info: {{ uac_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
