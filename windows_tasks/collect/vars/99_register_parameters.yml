# =====================================================================
# 99_パラメータシート登録 : 接続情報
#
# !!! 重要 !!! パスワードはこのファイルに書かないこと。
# Exastro の機密パラメータ、または extra-vars で渡す。
#   ansible-playbook 99_register_parameters.yml \
#     -e '{"exastro_password":"＜パスワード＞"}'
# =====================================================================

# Exastro の URL（末尾のスラッシュなし）
exastro_base_url: "http://10.197.18.118"

# 組織 ID / ワークスペース ID
exastro_organization: "omca-kab"
exastro_workspace: "omca-kab-dev1"

# 認証
exastro_user: "admin"
exastro_password: ""     # ← ここには書かない。extra-vars / 機密パラメータで渡す

# 自己署名証明書の環境では false のままにする
exastro_validate_certs: false

# 登録時の type
#   Register = 新規登録 / Update = 更新
# ※ 同じホスト・同じ項目で Register を2回実行すると重複・一意制約エラーになる。
#   オペレーションを分けて履歴として残す運用を想定している。
exastro_record_type: "Register"

# =====================================================================
# オペレーション列
#
# パラメータシートを「ホスト/オペレーションあり」で作成した場合、
# host_name に加えてオペレーションの指定が必要になる。
#
# Exastro から実行すると __operation__ に
# 「<オペレーション名>_<UUID>:<日付>」形式で渡るため、
# 参考実装と同じ正規表現でオペレーション名に戻している。
#
# シートを「ホスト/オペレーションなし」で作成した場合は
# exastro_use_operation を false にする（列自体を送らない）。
# =====================================================================
exastro_use_operation: true
exastro_operation_column: "operation_name_select"
exastro_operation_value: "{{ __operation__ | default('') | regex_replace('_[0-9a-zA-Z-]{36}:', '_') }}"

# ホスト名の列名（パラメータシートの「ホスト」列）
exastro_host_column: "host_name"

# 変数ファイルの置き場所。
# Exastro の Conductor から実行する場合は __conductor_workflowdir__ が渡るため
# 通常は変更不要。単体でテストするときだけ extra-vars で上書きする。
collect_dir: "{{ __conductor_workflowdir__ }}"

# API 呼び出しが失敗しても Playbook を止めない（参考実装に合わせる）。
# 登録漏れに気付けなくなるため、既定では止める設定にしている。
exastro_ignore_errors: false
