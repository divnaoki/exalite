# =====================================================================
# パラメータシートの大項目定義（1.2 システム設定(自動化) の (1)〜(17)）
#
# 各 collect Playbook は「1設定項目 = 1レコード」の形で結果を出力し、
# 99_register_parameters.yml がまとめてパラメータシートへ登録する。
#
# 登録されるレコードの形（縦持ち）:
#   大項目   : (10) Windowsファイアウォール
#   項目名   : ドメイン プロファイル / ファイアウォールの状態
#   項目キー : s10_fw_domain_enabled
#   設定値   : 有効（推奨）
#
# 項目キーは大項目のプレフィックス（下記 prefix）を付けて出力する。
# 一意制約や期待値との突き合わせに使えるよう、値ではなくキーで識別できるようにしている。
# =====================================================================
param_sections:
  rdp:          {no: 1,  name: "リモートデスクトップ",                        prefix: "s01_rdp"}
  computer:     {no: 2,  name: "コンピューター名",                            prefix: "s02_computer"}
  performance:  {no: 3,  name: "パフォーマンス",                              prefix: "s03_performance"}
  dump:         {no: 4,  name: "メモリダンプ",                                prefix: "s04_dump"}
  netadapter:   {no: 5,  name: "ネットワークアダプター",                      prefix: "s05_netadapter"}
  computermgmt: {no: 6,  name: "コンピューターの管理",                        prefix: "s06_computermgmt"}
  ntp:          {no: 7,  name: "NTPサーバの設定",                             prefix: "s07_ntp"}
  feature:      {no: 8,  name: "役割と機能",                                  prefix: "s08_feature"}
  policy:       {no: 9,  name: "ローカルセキュリティポリシー",                prefix: "s09_policy"}
  firewall:     {no: 10, name: "Windowsファイアウォール",                     prefix: "s10_fw"}
  registry:     {no: 11, name: "変更レジストリ",                              prefix: "s11_registry"}
  teaming:      {no: 12, name: "ネットワークのチーム化と優先度、IPv6無効化",  prefix: "s12_teaming"}
  smb:          {no: 13, name: "SMB3.0 マルチチャネルの無効化",               prefix: "s13_smb"}
  software:     {no: 14, name: "ソフトウェア制御",                            prefix: "s14_uac"}
  eventlog:     {no: 15, name: "イベントログ",                                prefix: "s15_eventlog"}
  snmp:         {no: 16, name: "SNMPサービス、ESMPRO/ServerAgentService",     prefix: "s16_snmp"}
  service:      {no: 17, name: "サービス",                                    prefix: "s17_service"}

# ローカルユーザーはチェックシートでは (6) コンピューターの管理 配下の
# 「ローカルユーザーとグループ」に該当するため、同じ大項目に含める。

# =====================================================================
# パラメータシートの列名
#
# !!! 重要 !!! ここに書いた文字列が、そのまま API の parameter のキーになる。
# Exastro で作成したパラメータシートの「項目名」と完全に一致させること。
# シート側の項目名を変えた場合は、ここを直せば Playbook の修正は不要。
# =====================================================================
param_columns:
  section: "大項目"      # 例: (10) Windowsファイアウォール
  item: "項目名"         # 例: ドメイン プロファイル / ファイアウォールの状態
  key: "項目キー"        # 例: s10_fw_domain_enabled
  value: "設定値"        # 例: 有効（推奨）

# =====================================================================
# 登録先メニュー
#
# 既定では全ての大項目を1つのパラメータシートへ登録する。
# 大項目ごとにシートを分ける場合は param_section_menus に
# 「大項目キー: メニューID」を書けば、そのシートへ登録される。
# =====================================================================
param_section_menu_default: "check_parameter"
param_section_menus: {}
