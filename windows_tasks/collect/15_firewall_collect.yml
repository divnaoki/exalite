---
# =====================================================================
# [収集] (10) Windowsファイアウォール -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_firewall__<ホスト名>
# 値はパラメータシートと同じ表記（有効（推奨）/ ブロック（既定）等）にする。
# =====================================================================
- name: "[収集] (10) Windowsファイアウォール"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/sections.yml
    - ../vars/15_firewall.yml

  vars:
    sec: "{{ param_sections.firewall }}"
    sec_menu: "{{ param_section_menus.firewall | default(param_section_menu_default) }}"
    var_key: "collected_firewall__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"
    # 取得値 -> パラメータシートの表記
    fw_state_labels:
      "True": "有効（推奨）"
      "False": "無効"
    fw_action_labels:
      "Block": "ブロック（既定）"
      "Allow": "許可（既定）"
      "NotConfigured": "未構成"
    fw_profile_labels:
      "Any": "すべて"

  tasks:
    - name: "現在のファイアウォール設定を取得"
      ansible.windows.win_shell: |
        $names = '{{ fw_profile_settings | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })
        $ruleNames = '{{ fw_rules | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $rules = @(Get-NetFirewallRule -Name $ruleNames -EA SilentlyContinue | ForEach-Object {
          [ordered]@{
            Name    = $_.Name
            Enabled = ($_.Enabled.ToString() -eq 'True')
            Profile = $_.Profile.ToString()
          }
        })
        [ordered]@{ Profiles = $profiles; Rules = $rules } | ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_raw

    - name: "取得結果を名前で引ける辞書に格納"
      ansible.builtin.set_fact:
        fw_cur_map: >-
          {{ dict((fw_raw.stdout | from_json).Profiles | map(attribute='Name')
             | zip((fw_raw.stdout | from_json).Profiles)) }}
        fw_rule_map: >-
          {{ dict((fw_raw.stdout | from_json).Rules | map(attribute='Name')
             | zip((fw_raw.stdout | from_json).Rules)) }}

    # プロファイル × 3項目 = 3レコード
    - name: "項目を組み立て（プロファイル）"
      ansible.builtin.set_fact:
        fw_rows: >-
          {{ fw_rows | default([]) + [
               { 'key': (sec.prefix ~ '_' ~ (item.name | lower) ~ '_enabled'),
                 'item': (item.label ~ ' / 状態 / ファイアウォールの状態'),
                 'value': (fw_state_labels[(cur.Enabled | string)] | default('不明', true)) },
               { 'key': (sec.prefix ~ '_' ~ (item.name | lower) ~ '_inbound'),
                 'item': (item.label ~ ' / 状態 / 受信接続'),
                 'value': (fw_action_labels[cur.Inbound] | default(cur.Inbound, true)) },
               { 'key': (sec.prefix ~ '_' ~ (item.name | lower) ~ '_outbound'),
                 'item': (item.label ~ ' / 状態 / 送信接続'),
                 'value': (fw_action_labels[cur.Outbound] | default(cur.Outbound, true)) } ] }}
      vars:
        cur: "{{ fw_cur_map[item.name] }}"
      loop: "{{ fw_profile_settings }}"
      loop_control:
        label: "{{ item.label }}"

    # 受信の規則（存在しない場合は「存在しない」を残す）
    - name: "項目を組み立て（受信の規則）"
      ansible.builtin.set_fact:
        fw_rows: >-
          {{ fw_rows + [
               { 'key': (sec.prefix ~ '_rule_' ~ (item.name | lower | regex_replace('[^0-9a-z]', '_')) ~ '_enabled'),
                 'item': ('受信の規則 / ' ~ item.label ~ ' / 有効'),
                 'value': ('存在しない' if (item.name not in fw_rule_map)
                           else ('TRUE' if (fw_rule_map[item.name].Enabled | bool) else 'FALSE')) },
               { 'key': (sec.prefix ~ '_rule_' ~ (item.name | lower | regex_replace('[^0-9a-z]', '_')) ~ '_profile'),
                 'item': ('受信の規則 / ' ~ item.label ~ ' / プロファイル'),
                 'value': ('存在しない' if (item.name not in fw_rule_map)
                           else (fw_profile_labels[fw_rule_map[item.name].Profile]
                                 | default(fw_rule_map[item.name].Profile, true))) } ] }}
      loop: "{{ fw_rules }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        fw_record: >-
          {{ { 'menu': sec_menu,
               'host_name': inventory_hostname,
               'section': ('(' ~ sec.no ~ ') ' ~ sec.name),
               'rows': fw_rows } }}

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/{{ sec.prefix }}_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: fw_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: fw_record
