---
# =====================================================================
# [収集] Windowsファイアウォール設定情報
#
# 対象プロファイル・受信の規則は ../vars/15_firewall.yml の
# fw_profile_settings / fw_rules を使う。
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# firewall_info として JSON で出力する。
#
#   firewall_info:
#     {"profiles": {"Domain": {"name": "Domain", "label": "ドメイン プロファイル",
#                              "enabled": true,
#                              "default_inbound_action": "Block",
#                              "default_outbound_action": "Allow"}, ... },
#      "rules": {"RemoteDesktop-UserMode-In-TCP": {"name": ..., "label": ...,
#                                                  "exists": true, "enabled": true,
#                                                  "profile": "Any"}, ... }}
# =====================================================================
- name: "15_Windowsファイアウォール設定情報収集"
  hosts: windows
  gather_facts: false

  vars_files:
    - ../vars/15_firewall.yml

  tasks:
    - name: Windowsファイアウォール設定情報取得（Before）
      ansible.windows.win_shell: |
        $namesRaw = '{{ fw_profile_settings | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })
        $ruleNamesRaw = '{{ fw_rules | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $ruleNames = @($ruleNamesRaw)
        $rules = @(Get-NetFirewallRule -Name $ruleNames -EA SilentlyContinue | ForEach-Object {
          [ordered]@{
            Name    = $_.Name
            Enabled = ($_.Enabled.ToString() -eq 'True')
            Profile = $_.Profile.ToString()
          }
        })
        [ordered]@{ Profiles = $profiles; Rules = $rules } | ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_info

    - name: パラメータシート登録用形式設定（プロファイル）
      set_fact:
        firewall_raw: >-
          {{ firewall_raw | default({'profiles': {}, 'rules': {}})
             | combine({'profiles': { item.name: {
                 'name': item.name,
                 'label': item.label,
                 'enabled': cur.Enabled,
                 'default_inbound_action': cur.Inbound,
                 'default_outbound_action': cur.Outbound
               } }}, recursive=true) }}
      vars:
        prof_map: >-
          {{ dict((fw_info.stdout | from_json).Profiles | map(attribute='Name')
             | zip((fw_info.stdout | from_json).Profiles)) }}
        cur: "{{ prof_map[item.name] }}"
      loop: "{{ fw_profile_settings }}"
      loop_control:
        label: "{{ item.label }}"

    # 存在しない規則は exists: false とし、enabled / profile は null にする
    - name: パラメータシート登録用形式設定（受信の規則）
      set_fact:
        firewall_raw: >-
          {{ firewall_raw | combine({'rules': { item.name: {
               'name': item.name,
               'label': item.label,
               'exists': (item.name in rule_map),
               'enabled': (rule_map[item.name].Enabled if (item.name in rule_map) else none),
               'profile': (rule_map[item.name].Profile if (item.name in rule_map) else none)
             } }}, recursive=true) }}
      vars:
        rule_map: >-
          {{ dict((fw_info.stdout | from_json).Rules | map(attribute='Name')
             | zip((fw_info.stdout | from_json).Rules)) }}
      loop: "{{ fw_rules }}"
      loop_control:
        label: "{{ item.label }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ firewall_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/firewall"
        block: |
          firewall_info: {{ firewall_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
