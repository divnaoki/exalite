---
# =====================================================================
# [収集] 16_メモリダンプ設定 -> パラメータシート用の変数ファイル出力
#
# 出力する変数名: collected_dump__<ホスト名>
# 値はパラメータシートと同じ表記（例: カーネルダンプ）で登録する。
# =====================================================================
- name: "[収集] 16_メモリダンプ設定"
  hosts: windows
  gather_facts: false

  vars:
    reg_crash: 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl'
    var_key: "collected_dump__{{ inventory_hostname | regex_replace('[^0-9a-zA-Z_]', '_') }}"
    # CrashDumpEnabled -> パラメータシートの表記
    # （vars/16_memory_dump.yml の dump_type_labels は画面表示に合わせた表記のため、
    #   シートに合わせた表記をここで別に持つ）
    dump_sheet_labels:
      0: "なし"
      1: "完全ダンプ"
      2: "カーネルダンプ"
      3: "小ダンプ"
      7: "自動ダンプ"

  tasks:
    - name: "現在のメモリダンプ設定を取得"
      ansible.windows.win_shell: |
        $p = Get-ItemProperty '{{ reg_crash }}' -EA SilentlyContinue
        [ordered]@{
          CrashDumpEnabled = $(if ($null -eq $p.CrashDumpEnabled) { $null } else { [int]$p.CrashDumpEnabled })
          DumpFile         = $p.DumpFile
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: dump_raw

    - name: "登録用レコードを作成"
      ansible.builtin.set_fact:
        dump_record:
          host_name: "{{ inventory_hostname }}"
          dump_write_debug_info: >-
            {{ dump_sheet_labels[cur.CrashDumpEnabled | int]
               | default('不明(' ~ (cur.CrashDumpEnabled | default('未設定', true)) ~ ')', true) }}
          dump_file: "{{ cur.DumpFile | default('未設定', true) }}"
      vars:
        cur: "{{ dump_raw.stdout | from_json }}"

    - name: "変数ファイルを出力"
      ansible.builtin.copy:
        dest: "{{ __conductor_workflowdir__ }}/dump_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: "{{ { var_key: dump_record } | to_nice_yaml }}"
      delegate_to: localhost
      changed_when: true

    - name: "出力内容を表示"
      ansible.builtin.debug:
        var: dump_record
