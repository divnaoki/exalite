---
# =====================================================================
# [収集] メモリダンプ設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# memory_dump_info として JSON で出力する。
#
#   memory_dump_info: {"crash_dump_enabled": 2,
#                      "crash_dump_type": "カーネルダンプ",
#                      "dump_file": "%SystemRoot%\\MEMORY.DMP",
#                      "auto_reboot": true}
#
# crash_dump_type は CrashDumpEnabled を画面表示のラベルに変換したもの。
# =====================================================================
- name: "16_メモリダンプ設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    reg_crash: 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl'
    # CrashDumpEnabled -> 画面表示のラベル
    dump_type_labels:
      0: "なし"
      1: "完全ダンプ"
      2: "カーネルダンプ"
      3: "小ダンプ"
      7: "自動ダンプ"

  tasks:
    - name: メモリダンプ設定情報取得（Before）
      ansible.windows.win_shell: |
        $p = Get-ItemProperty '{{ reg_crash }}' -EA SilentlyContinue
        [ordered]@{
          CrashDumpEnabled = $(if ($null -eq $p.CrashDumpEnabled) { $null } else { [int]$p.CrashDumpEnabled })
          DumpFile         = $p.DumpFile
          AutoReboot       = $(if ($null -eq $p.AutoReboot) { $null } else { [int]$p.AutoReboot })
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: dump_info

    - name: パラメータシート登録用形式設定
      set_fact:
        dump_raw: >-
          {{ { 'crash_dump_enabled': cur.CrashDumpEnabled,
               'crash_dump_type': (none if cur.CrashDumpEnabled is none
                                   else (dump_type_labels[cur.CrashDumpEnabled | int]
                                         | default('対応表にない値', true))),
               'dump_file': cur.DumpFile,
               'auto_reboot': (none if cur.AutoReboot is none
                               else ((cur.AutoReboot | int) == 1)) } }}
      vars:
        cur: "{{ dump_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ dump_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/memory_dump"
        block: |
          memory_dump_info: {{ dump_raw | trim | to_json(ensure_ascii=False) }}
      delegate_to: localhost
