---
# =====================================================================
# [収集] 時刻同期（NTPサーバ）設定情報
#
# 取得した内容を 1 つの変数へまとめ、パラメータシート登録用ファイルへ
# time_sync_info として JSON で出力する。
#
#   time_sync_info: {"sync_enabled": true,
#                    "type": "NTP",
#                    "server": "ntp.nict.jp",
#                    "ntp_server": "ntp.nict.jp,0x9",
#                    "source": "ntp.nict.jp"}
#
# server は GUI「インターネット時刻設定」のサーバー欄、
# ntp_server は W32Time のレジストリ値、source は実際の同期元。
# =====================================================================
- name: "14_時刻同期設定情報収集"
  hosts: windows
  gather_facts: false

  vars:
    reg_w32_param: 'HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters'
    reg_dt_servers: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\DateTime\Servers'

  tasks:
    - name: 時刻同期設定情報取得（Before）
      ansible.windows.win_shell: |
        # GUI のサーバー欄は NtpServer ではなく DateTime\Servers の
        # 既定インデックスが指すエントリを表示する
        $d = (Get-ItemProperty '{{ reg_dt_servers }}' -EA SilentlyContinue).'(default)'
        $gui = if ($d) { (Get-ItemProperty '{{ reg_dt_servers }}' -Name $d -EA SilentlyContinue).$d } else { $null }
        [ordered]@{
          Type      = (Get-ItemProperty '{{ reg_w32_param }}' -Name Type -EA SilentlyContinue).Type
          NtpServer = (Get-ItemProperty '{{ reg_w32_param }}' -Name NtpServer -EA SilentlyContinue).NtpServer
          GuiServer = $gui
          Source    = (w32tm /query /source)
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: ntp_info

    - name: パラメータシート登録用形式設定
      set_fact:
        ntp_raw: >-
          {{ { 'sync_enabled': (cur.Type == 'NTP'),
               'type': cur.Type,
               'server': cur.GuiServer,
               'ntp_server': cur.NtpServer,
               'source': (cur.Source | default('', true) | trim) } }}
      vars:
        cur: "{{ ntp_info.stdout | from_json }}"

    - name: 取得情報出力
      debug:
        msg: |
          "{{ ntp_raw }}"

    - name: パラメータシート登録用ファイル出力
      blockinfile:
        create: yes
        mode: '0644'
        dest: "{{ __conductor_workflowdir__ }}/{{ __inventory_hostname__ }}/time_sync"
        block: |
          time_sync_info: |
            {{ ntp_raw | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }}
      delegate_to: localhost
