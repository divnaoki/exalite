---
# =====================================================================
# 16_メモリダンプ設定（起動と回復 > デバッグ情報の書き込み）
#
#   PHASE 0  パラメータシートの値をレジストリ値に変換
#   PHASE 1  変更前の設定情報を取得
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を取得して確認
#
# 実体: HKLM\SYSTEM\CurrentControlSet\Control\CrashControl
#         CrashDumpEnabled  0=なし / 1=完全 / 2=カーネル / 3=小 / 7=自動
#
# 設定値は vars/16_memory_dump.yml で定義。
# Exastro からは「カーネルダンプ」のような日本語ラベルが渡るため、
# PHASE 0 で変換表を使いレジストリ値へ変換する。
# =====================================================================
- name: "16_メモリダンプ設定"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/16_memory_dump.yml

  vars:
    reg_crash: 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl'

  tasks:
    # =================================================================
    # PHASE 0: パラメータシートの値をレジストリ値に変換
    # =================================================================
    - name: "[PREP] 指定値を正規化して変換"
      ansible.builtin.set_fact:
        dump_value: "{{ dump_type_map[dump_norm] | default('') }}"
      vars:
        dump_norm: >-
          {{ dump_write_debug_info | string | trim
             | replace(' ', '') | replace('　', '')
             | replace('（', '(') | replace('）', ')')
             | replace('メモリ', '')
             | upper }}

    - name: "[GUARD] 指定値を変換できたか検証"
      ansible.builtin.assert:
        that:
          - dump_value != ''
        success_msg: >-
          「{{ dump_write_debug_info }}」 -> CrashDumpEnabled={{ dump_value }}
          ({{ dump_type_labels[dump_value | int] | default('不明') }}) に変換しました。
        fail_msg: >-
          「{{ dump_write_debug_info }}」を変換できません。
          指定できる値: {{ dump_type_map.keys() | list }}

    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] 現在設定を取得"
      ansible.windows.win_shell: |
        $p = Get-ItemProperty '{{ reg_crash }}' -EA SilentlyContinue
        [ordered]@{
          CrashDumpEnabled = $(if ($null -eq $p.CrashDumpEnabled) { $null } else { [int]$p.CrashDumpEnabled })
          # 参考情報（本 Playbook では変更しない）
          DumpFile   = $p.DumpFile
          Overwrite  = $(if ($null -eq $p.Overwrite) { $null } else { [int]$p.Overwrite })
          AutoReboot = $(if ($null -eq $p.AutoReboot) { $null } else { [int]$p.AutoReboot })
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: dump_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        dump_before: "{{ dump_before_raw.stdout | from_json }}"

    - name: "[BEFORE] 現在設定と指定値を表示"
      ansible.builtin.debug:
        msg:
          - "デバッグ情報の書き込み : {{ dump_type_labels[dump_before.CrashDumpEnabled | int] | default('未設定/不明', true) }}({{ dump_before.CrashDumpEnabled | default('未設定', true) }}) -> {{ dump_type_labels[dump_value | int] }}({{ dump_value }})"
          - "ダンプファイル         : {{ dump_before.DumpFile | default('未設定', true) }}"
          - "上書き/自動再起動      : Overwrite={{ dump_before.Overwrite | default('未設定', true) }}, AutoReboot={{ dump_before.AutoReboot | default('未設定', true) }}"

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================
    - name: "デバッグ情報の書き込みを設定 (CrashDumpEnabled)"
      ansible.windows.win_regedit:
        path: "{{ reg_crash }}"
        name: CrashDumpEnabled
        data: "{{ dump_value }}"
        type: dword
      when: (dump_before.CrashDumpEnabled | default(-1) | int) != (dump_value | int)

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] 設定を再取得"
      ansible.windows.win_shell: |
        $p = Get-ItemProperty '{{ reg_crash }}' -EA SilentlyContinue
        [ordered]@{
          CrashDumpEnabled = $(if ($null -eq $p.CrashDumpEnabled) { $null } else { [int]$p.CrashDumpEnabled })
          DumpFile   = $p.DumpFile
          Overwrite  = $(if ($null -eq $p.Overwrite) { $null } else { [int]$p.Overwrite })
          AutoReboot = $(if ($null -eq $p.AutoReboot) { $null } else { [int]$p.AutoReboot })
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      changed_when: false
      register: dump_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        dump_after: "{{ dump_after_raw.stdout | from_json }}"

    - name: "[AFTER] 変更後の設定を表示"
      ansible.builtin.debug:
        var: dump_after

    - name: "[AFTER] 設定値が反映されたことを確認"
      ansible.builtin.assert:
        that:
          - (dump_after.CrashDumpEnabled | int) == (dump_value | int)
        success_msg: >-
          デバッグ情報の書き込みが
          {{ dump_type_labels[dump_after.CrashDumpEnabled | int] }}({{ dump_after.CrashDumpEnabled }})
          になりました。
        fail_msg: >-
          設定値が一致しません
          (実際={{ dump_after.CrashDumpEnabled }} / 期待={{ dump_value }})。
