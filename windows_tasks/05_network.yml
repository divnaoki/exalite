---
# =====================================================================
# 05_ネットワーク接続 設定
#
# 構成ルール:
#   PHASE 1  変更前の設定情報を取得（必ず取得）
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を再取得して確認
#
# 変数は vars/05_network.yml で定義（IP等の「要確定」は事前に確定させること）
# =====================================================================
- name: "05_ネットワーク接続 設定"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/05_network.yml

  tasks:
    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] NIC の現在設定を取得"
      ansible.windows.win_powershell:
        parameters:
          DisplayName: "{{ nic1_display_name }}"
          CurrentName: "{{ nic1_current_name }}"
        script: |
          param($DisplayName, $CurrentName)
          $r = [ordered]@{
            AdapterFound=$false; AdapterName=$null; IfIndex=$null
            DhcpEnabled=$null; AutomaticMetric=$null; InterfaceMetric=$null
            Ipv4Address=$null; Ipv4Prefix=$null; Ipv4Gateway=$null
            DnsServers=@(); RegisterThisConnectionsAddress=$null
            Binding_ms_implat=$null; Binding_ms_lldp=$null; Binding_ms_tcpip6=$null
            Binding_ms_rspndr=$null; Binding_ms_lltdio=$null
            WinsPrimaryServer=$null; TcpipNetbiosOptions=$null; LmHostsEnabled=$null
          }
          $a = Get-NetAdapter -Name $DisplayName -ErrorAction SilentlyContinue
          if (-not $a) { $a = Get-NetAdapter -Name $CurrentName -ErrorAction SilentlyContinue }
          if ($a) {
            $alias = $a.Name; $idx = $a.ifIndex
            $r.AdapterFound = $true; $r.AdapterName = $alias; $r.IfIndex = $idx
            $ipif = Get-NetIPInterface -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if ($ipif) {
              $r.DhcpEnabled     = ($ipif.Dhcp -eq 'Enabled')
              $r.AutomaticMetric = ($ipif.AutomaticMetric -eq 'Enabled')
              $r.InterfaceMetric = [int]$ipif.InterfaceMetric
            }
            $ip = Get-NetIPAddress -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ip) { $r.Ipv4Address = $ip.IPAddress; $r.Ipv4Prefix = [int]$ip.PrefixLength }
            $rt = Get-NetRoute -InterfaceIndex $idx -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($rt) { $r.Ipv4Gateway = $rt.NextHop }
            $dns = Get-DnsClientServerAddress -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if ($dns) { $r.DnsServers = @($dns.ServerAddresses) }
            $dc = Get-DnsClient -InterfaceIndex $idx -ErrorAction SilentlyContinue
            if ($dc) { $r.RegisterThisConnectionsAddress = [bool]$dc.RegisterThisConnectionsAddress }
            foreach ($c in 'ms_implat','ms_lldp','ms_tcpip6','ms_rspndr','ms_lltdio') {
              $b = Get-NetAdapterBinding -Name $alias -ComponentID $c -ErrorAction SilentlyContinue
              if ($b) { $r."Binding_$c" = [bool]$b.Enabled }
            }
            $cfg = Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "InterfaceIndex=$idx" -ErrorAction SilentlyContinue
            if ($cfg) {
              $r.WinsPrimaryServer   = $cfg.WINSPrimaryServer
              $r.TcpipNetbiosOptions = $cfg.TcpipNetbiosOptions
              $r.LmHostsEnabled      = [bool]$cfg.WINSEnableLMHostsLookup
            }
          }
          [PSCustomObject]$r
      register: nic_before

    - name: "[BEFORE] 現在設定を表示"
      ansible.builtin.debug:
        var: nic_before.output

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================

    # --- アダプター名 ---
    - name: "アダプター名を変更"
      ansible.windows.win_shell: |
        Rename-NetAdapter -Name "{{ nic1_current_name }}" -NewName "{{ nic1_display_name }}"
      args:
        executable: powershell
      when:
        - nic_before.output[0].AdapterFound
        - nic_before.output[0].AdapterName != nic1_display_name
      changed_when: true

    # --- IPv4 DHCP/固定 ---
    - name: "IPv4 の DHCP/固定 を設定"
      ansible.windows.win_shell: |
        Set-NetIPInterface -InterfaceAlias "{{ nic1_display_name }}" -Dhcp {{ 'Enabled' if nic1_ipv4_dhcp_enabled else 'Disabled' }}
      args:
        executable: powershell
      when: nic_before.output[0].DhcpEnabled != (nic1_ipv4_dhcp_enabled | bool)
      changed_when: true

    # --- 固定IP（IP / プレフィックス / ゲートウェイをまとめて設定）---
    - name: "固定IPアドレスを設定"
      ansible.windows.win_shell: |
        $ex = Get-NetIPAddress -InterfaceAlias "{{ nic1_display_name }}" -AddressFamily IPv4 -ErrorAction SilentlyContinue
        if ($ex) { $ex | Remove-NetIPAddress -Confirm:$false }
        New-NetIPAddress -InterfaceAlias "{{ nic1_display_name }}" -IPAddress "{{ nic1_ipv4_address }}" `
          -PrefixLength {{ nic1_ipv4_prefix_length }} -DefaultGateway "{{ nic1_ipv4_gateway }}"
      args:
        executable: powershell
      when:
        - not (nic1_ipv4_dhcp_enabled | bool)
        - >-
          nic_before.output[0].Ipv4Address != nic1_ipv4_address
          or (nic_before.output[0].Ipv4Prefix | int) != (nic1_ipv4_prefix_length | int)
          or nic_before.output[0].Ipv4Gateway != nic1_ipv4_gateway
      changed_when: true

    # --- DNSサーバー（win_dns_client は冪等：現状と一致すれば changed=false）---
    - name: "DNSサーバーを設定（自動取得 or 手動）"
      ansible.windows.win_dns_client:
        adapter_names: "{{ nic1_display_name }}"
        dns_servers: "{{ [] if nic1_dns_auto_obtain else [nic1_dns_preferred, nic1_dns_alternate] }}"

    # --- この接続のアドレスをDNSに登録 ---
    - name: "この接続のアドレスをDNSに登録 を設定"
      ansible.windows.win_shell: |
        Set-DnsClient -InterfaceAlias "{{ nic1_display_name }}" -RegisterThisConnectionsAddress ${{ 'true' if nic1_dns_register_address else 'false' }}
      args:
        executable: powershell
      when: nic_before.output[0].RegisterThisConnectionsAddress != (nic1_dns_register_address | bool)
      changed_when: true

    # --- インターフェイスメトリック（LAN 種別ごとに固定値を設定）---
    # パラメータシートの指定値を、自動メトリックを無効にしたうえで設定する。
    #   サーバサブネット         : 10
    #   運用管理LANサブネット    : 20
    #   バックアップLANサブネット: 30
    # 対象は vars/05_network.yml の interface_metrics。
    # 対象サーバーに存在しないアダプターはスキップし、PHASE 3 で報告する。
    - name: "[BEFORE] メトリック対象アダプターの現在設定を取得"
      ansible.windows.win_shell: |
        # PS5.1 の ConvertFrom-Json は配列を1個のオブジェクトとしてパイプへ流すため、
        # 一度変数へ受けてから @() で配列化する
        $namesRaw = '{{ interface_metrics | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        $list = @()
        foreach ($n in $names) {
          $a = Get-NetAdapter -Name $n -ErrorAction SilentlyContinue
          if ($a) {
            $ipif = Get-NetIPInterface -InterfaceIndex $a.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object -First 1
            $list += [PSCustomObject][ordered]@{
              Name            = $n
              Found           = $true
              AutomaticMetric = ($ipif.AutomaticMetric -eq 'Enabled')
              InterfaceMetric = [int]$ipif.InterfaceMetric
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Found = $false; AutomaticMetric = $null; InterfaceMetric = $null
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: metric_before_raw

    - name: "[BEFORE] 取得結果をアダプター名で引ける辞書に格納"
      ansible.builtin.set_fact:
        metric_before: >-
          {{ dict((metric_before_raw.stdout | from_json) | map(attribute='Name')
             | zip(metric_before_raw.stdout | from_json)) }}

    - name: "[BEFORE] メトリックの現在値と指定値を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item.label }} ({{ item.name }}) :
          {{ '存在しない（スキップ）' if not metric_before[item.name].Found
             else ('自動メトリック=' ~ metric_before[item.name].AutomaticMetric
                   ~ ' / メトリック=' ~ metric_before[item.name].InterfaceMetric
                   ~ ' -> 自動メトリック=False / メトリック=' ~ item.metric) }}
      loop: "{{ interface_metrics }}"
      loop_control:
        label: "{{ item.label }}"

    # -InterfaceMetric を指定すると自動メトリックの無効化と値の設定が同時に行われる。
    # -AutomaticMetric Disabled は単独では指定できない（Windows System Error 87）ため使わない。
    # 自動メトリックが有効な場合は、値が偶然一致していても手動へ切り替える必要がある。
    - name: "インターフェイスメトリック値を設定（自動メトリックは無効になる）"
      ansible.windows.win_shell: |
        Set-NetIPInterface -InterfaceAlias "{{ item.name }}" -AddressFamily IPv4 -InterfaceMetric {{ item.metric }}
      args:
        executable: powershell
      loop: "{{ interface_metrics }}"
      loop_control:
        label: "{{ item.label }} ({{ item.name }}) -> {{ item.metric }}"
      when:
        - metric_before[item.name].Found
        - >-
          (metric_before[item.name].AutomaticMetric | bool)
          or ((metric_before[item.name].InterfaceMetric | int) != (item.metric | int))
      changed_when: true

    # --- WINSサーバーアドレス ---
    - name: "WINSサーバーアドレス を設定"
      ansible.windows.win_shell: |
        $idx = (Get-NetAdapter -Name "{{ nic1_display_name }}").ifIndex
        $cfg = Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "InterfaceIndex=$idx"
        Invoke-CimMethod -InputObject $cfg -MethodName SetWINSServer `
          -Arguments @{WINSPrimaryServer="{{ nic1_wins_address }}"; WINSSecondaryServer=""}
      args:
        executable: powershell
      when: nic_before.output[0].WinsPrimaryServer != nic1_wins_address
      changed_when: true

    # --- LMHOSTS 参照有効/無効（グローバル設定）---
    - name: "LMHOSTS の参照有効/無効 を設定"
      ansible.windows.win_shell: |
        $idx = (Get-NetAdapter -Name "{{ nic1_display_name }}").ifIndex
        $cfg = Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "InterfaceIndex=$idx"
        Invoke-CimMethod -InputObject $cfg -MethodName EnableWINS `
          -Arguments @{DNSEnabledForWINSResolution=$false; WINSEnableLMHostsLookup=${{ 'true' if nic1_wins_lmhosts_enabled else 'false' }}}
      args:
        executable: powershell
      when: nic_before.output[0].LmHostsEnabled != (nic1_wins_lmhosts_enabled | bool)
      changed_when: true

    # --- NetBIOS over TCP/IP ---
    - name: "NetBIOS over TCP/IP 設定"
      ansible.windows.win_shell: |
        $idx = (Get-NetAdapter -Name "{{ nic1_display_name }}").ifIndex
        $cfg = Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "InterfaceIndex=$idx"
        Invoke-CimMethod -InputObject $cfg -MethodName SetTcpipNetbios `
          -Arguments @{TcpipNetbiosOptions={{ nic1_netbios_setting }}}
      args:
        executable: powershell
      when: (nic_before.output[0].TcpipNetbiosOptions | int) != (nic1_netbios_setting | int)
      changed_when: true

    # --- コンポーネント: Multiplexor Protocol (ms_implat) ---
    - name: "コンポーネント Multiplexor Protocol (ms_implat) を設定"
      ansible.windows.win_shell: |
        {{ 'Enable' if nic1_component_multiplexor_enabled else 'Disable' }}-NetAdapterBinding -Name "{{ nic1_display_name }}" -ComponentID ms_implat
      args:
        executable: powershell
      when: nic_before.output[0].Binding_ms_implat != (nic1_component_multiplexor_enabled | bool)
      changed_when: true

    # --- コンポーネント: LLDP Protocol Driver (ms_lldp) ---
    - name: "コンポーネント LLDP Protocol Driver (ms_lldp) を設定"
      ansible.windows.win_shell: |
        {{ 'Enable' if nic1_component_lldp_enabled else 'Disable' }}-NetAdapterBinding -Name "{{ nic1_display_name }}" -ComponentID ms_lldp
      args:
        executable: powershell
      when: nic_before.output[0].Binding_ms_lldp != (nic1_component_lldp_enabled | bool)
      changed_when: true

    # --- コンポーネント: TCP/IPv6 (ms_tcpip6) ---
    - name: "コンポーネント TCP/IPv6 (ms_tcpip6) を設定"
      ansible.windows.win_shell: |
        {{ 'Enable' if nic1_component_ipv6_enabled else 'Disable' }}-NetAdapterBinding -Name "{{ nic1_display_name }}" -ComponentID ms_tcpip6
      args:
        executable: powershell
      when: nic_before.output[0].Binding_ms_tcpip6 != (nic1_component_ipv6_enabled | bool)
      changed_when: true

    # --- コンポーネント: LLTD Responder (ms_rspndr) ---
    - name: "コンポーネント LLTD Responder (ms_rspndr) を設定"
      ansible.windows.win_shell: |
        {{ 'Enable' if nic1_component_lltd_responder_enabled else 'Disable' }}-NetAdapterBinding -Name "{{ nic1_display_name }}" -ComponentID ms_rspndr
      args:
        executable: powershell
      when: nic_before.output[0].Binding_ms_rspndr != (nic1_component_lltd_responder_enabled | bool)
      changed_when: true

    # --- コンポーネント: LLTD Mapper I/O Driver (ms_lltdio) ---
    - name: "コンポーネント LLTD Mapper I/O Driver (ms_lltdio) を設定"
      ansible.windows.win_shell: |
        {{ 'Enable' if nic1_component_lltd_mapper_enabled else 'Disable' }}-NetAdapterBinding -Name "{{ nic1_display_name }}" -ComponentID ms_lltdio
      args:
        executable: powershell
      when: nic_before.output[0].Binding_ms_lltdio != (nic1_component_lltd_mapper_enabled | bool)
      changed_when: true

    # =================================================================
    # PHASE 3: 変更後の設定情報を再取得（確認）
    # =================================================================
    - name: "[AFTER] NIC の設定を再取得"
      ansible.windows.win_powershell:
        parameters:
          DisplayName: "{{ nic1_display_name }}"
          CurrentName: "{{ nic1_current_name }}"
        script: |
          param($DisplayName, $CurrentName)
          $r = [ordered]@{
            AdapterFound=$false; AdapterName=$null; IfIndex=$null
            DhcpEnabled=$null; AutomaticMetric=$null; InterfaceMetric=$null
            Ipv4Address=$null; Ipv4Prefix=$null; Ipv4Gateway=$null
            DnsServers=@(); RegisterThisConnectionsAddress=$null
            Binding_ms_implat=$null; Binding_ms_lldp=$null; Binding_ms_tcpip6=$null
            Binding_ms_rspndr=$null; Binding_ms_lltdio=$null
            WinsPrimaryServer=$null; TcpipNetbiosOptions=$null; LmHostsEnabled=$null
          }
          $a = Get-NetAdapter -Name $DisplayName -ErrorAction SilentlyContinue
          if (-not $a) { $a = Get-NetAdapter -Name $CurrentName -ErrorAction SilentlyContinue }
          if ($a) {
            $alias = $a.Name; $idx = $a.ifIndex
            $r.AdapterFound = $true; $r.AdapterName = $alias; $r.IfIndex = $idx
            $ipif = Get-NetIPInterface -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if ($ipif) {
              $r.DhcpEnabled     = ($ipif.Dhcp -eq 'Enabled')
              $r.AutomaticMetric = ($ipif.AutomaticMetric -eq 'Enabled')
              $r.InterfaceMetric = [int]$ipif.InterfaceMetric
            }
            $ip = Get-NetIPAddress -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ip) { $r.Ipv4Address = $ip.IPAddress; $r.Ipv4Prefix = [int]$ip.PrefixLength }
            $rt = Get-NetRoute -InterfaceIndex $idx -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($rt) { $r.Ipv4Gateway = $rt.NextHop }
            $dns = Get-DnsClientServerAddress -InterfaceIndex $idx -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if ($dns) { $r.DnsServers = @($dns.ServerAddresses) }
            $dc = Get-DnsClient -InterfaceIndex $idx -ErrorAction SilentlyContinue
            if ($dc) { $r.RegisterThisConnectionsAddress = [bool]$dc.RegisterThisConnectionsAddress }
            foreach ($c in 'ms_implat','ms_lldp','ms_tcpip6','ms_rspndr','ms_lltdio') {
              $b = Get-NetAdapterBinding -Name $alias -ComponentID $c -ErrorAction SilentlyContinue
              if ($b) { $r."Binding_$c" = [bool]$b.Enabled }
            }
            $cfg = Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "InterfaceIndex=$idx" -ErrorAction SilentlyContinue
            if ($cfg) {
              $r.WinsPrimaryServer   = $cfg.WINSPrimaryServer
              $r.TcpipNetbiosOptions = $cfg.TcpipNetbiosOptions
              $r.LmHostsEnabled      = [bool]$cfg.WINSEnableLMHostsLookup
            }
          }
          [PSCustomObject]$r
      register: nic_after

    - name: "[AFTER] 変更後の設定を表示"
      ansible.builtin.debug:
        var: nic_after.output

    # --- インターフェイスメトリックの確認 ---
    - name: "[AFTER] メトリック対象アダプターの設定を再取得"
      ansible.windows.win_shell: |
        $namesRaw = '{{ interface_metrics | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $names = @($namesRaw)
        $list = @()
        foreach ($n in $names) {
          $a = Get-NetAdapter -Name $n -ErrorAction SilentlyContinue
          if ($a) {
            $ipif = Get-NetIPInterface -InterfaceIndex $a.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object -First 1
            $list += [PSCustomObject][ordered]@{
              Name            = $n
              Found           = $true
              AutomaticMetric = ($ipif.AutomaticMetric -eq 'Enabled')
              InterfaceMetric = [int]$ipif.InterfaceMetric
            }
          } else {
            $list += [PSCustomObject][ordered]@{
              Name = $n; Found = $false; AutomaticMetric = $null; InterfaceMetric = $null
            }
          }
        }
        ConvertTo-Json -InputObject @($list) -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: metric_after_raw

    - name: "[AFTER] 取得結果をアダプター名で引ける辞書に格納"
      ansible.builtin.set_fact:
        metric_after: >-
          {{ dict((metric_after_raw.stdout | from_json) | map(attribute='Name')
             | zip(metric_after_raw.stdout | from_json)) }}

    - name: "[AFTER] メトリックの設定結果を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item.label }} ({{ item.name }}) :
          {{ '存在しないためスキップしました' if not metric_after[item.name].Found
             else ('自動メトリック=' ~ metric_after[item.name].AutomaticMetric
                   ~ ' / メトリック=' ~ metric_after[item.name].InterfaceMetric
                   ~ '（指定値=' ~ item.metric ~ '）') }}
      loop: "{{ interface_metrics }}"
      loop_control:
        label: "{{ item.label }}"

    # 存在したアダプターだけを確認対象にする（存在しないものはスキップ扱い）
    - name: "[AFTER] メトリックが指定値どおりであることを確認"
      ansible.builtin.assert:
        that:
          - not (metric_after[item.name].AutomaticMetric | bool)
          - (metric_after[item.name].InterfaceMetric | int) == (item.metric | int)
        success_msg: >-
          {{ item.label }} ({{ item.name }}) : 自動メトリック=無効 /
          メトリック={{ metric_after[item.name].InterfaceMetric }} で設定されています。
        fail_msg: >-
          {{ item.label }} ({{ item.name }}) の設定が一致しません
          (自動メトリック={{ metric_after[item.name].AutomaticMetric }} /
           メトリック={{ metric_after[item.name].InterfaceMetric }} /
           期待: 自動メトリック=無効, メトリック={{ item.metric }})。
      loop: "{{ interface_metrics }}"
      loop_control:
        label: "{{ item.label }}"
      when: metric_after[item.name].Found

    - name: "[AFTER] 存在しなかったアダプターを報告"
      ansible.builtin.debug:
        msg: >-
          !!! 未設定 !!! 次のアダプターは対象サーバーに存在しないため設定していません:
          {{ interface_metrics | rejectattr('name', 'in',
               (metric_after.values() | selectattr('Found') | map(attribute='Name') | list))
             | map(attribute='name') | list }}
          vars/05_network.yml の interface_metrics のアダプター名を実際の名前に合わせてください。
      when: >-
        (metric_after.values() | rejectattr('Found') | list | length) > 0
