---
# =====================================================================
# 15_Windows ファイアウォール設定
#
#   PHASE 0  パラメータシートの値を PowerShell の値に変換
#   PHASE 1  変更前の設定情報を取得
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を取得して確認
#
# 対象:
#   ・ドメイン / プライベート / パブリック 各プロファイルの
#     状態・受信接続・送信接続
#   ・受信の規則「ファイルとプリンターの共有」のプロファイルと有効化
#
# 設定値は vars/15_firewall.yml で定義。
# Exastro からは「有効（推奨）」「ブロック（既定）」のような日本語ラベルが渡るため、
# PHASE 0 で変換表を使い PowerShell の値（True / Block / Allow / Any）へ変換する。
# 列挙型はそのまま JSON 化すると数値になるため、PowerShell 側で文字列化している。
# =====================================================================
- name: "15_Windows ファイアウォール設定"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/15_firewall.yml

  tasks:
    # =================================================================
    # PHASE 0: パラメータシートの値を PowerShell の値に変換
    # =================================================================
    # 表記ゆれを吸収するため、空白・全角カッコ・「(既定)」「(推奨)」を除去し、
    # 英字は大文字化してから変換表（vars の *_map）と突き合わせる。
    - name: "[PREP] パラメータシートの値を正規化"
      ansible.builtin.set_fact:
        fw_norm: >-
          {{ dict(['enabled', 'inbound', 'outbound', 'rule_profile', 'rule_enabled']
             | zip([fw_enabled, fw_inbound_action, fw_outbound_action,
                    fw_rule_profile, fw_rule_enabled]
                   | map('string') | map('trim')
                   | map('replace', ' ', '') | map('replace', '　', '')
                   | map('replace', '（', '(') | map('replace', '）', ')')
                   | map('replace', '(既定)', '') | map('replace', '(推奨)', '')
                   | map('upper') | list)) }}

    - name: "[PREP] 変換表で PowerShell の値に変換"
      ansible.builtin.set_fact:
        fw_enabled_val: "{{ fw_state_map[fw_norm.enabled] | default('') }}"
        fw_inbound_val: "{{ fw_action_map[fw_norm.inbound] | default('') }}"
        fw_outbound_val: "{{ fw_action_map[fw_norm.outbound] | default('') }}"
        fw_rule_profile_val: "{{ fw_profile_map[fw_norm.rule_profile] | default('') }}"
        fw_rule_enabled_val: "{{ fw_state_map[fw_norm.rule_enabled] | default('') }}"

    - name: "[GUARD] 指定値を変換できたか検証"
      ansible.builtin.assert:
        that:
          - fw_enabled_val != ''
          - fw_inbound_val != ''
          - fw_outbound_val != ''
          - fw_rule_profile_val != ''
          - fw_rule_enabled_val != ''
        success_msg: >-
          変換しました: 状態={{ fw_enabled_val }}, 受信={{ fw_inbound_val }},
          送信={{ fw_outbound_val }},
          規則プロファイル={{ fw_rule_profile_val }}, 規則有効={{ fw_rule_enabled_val }}
        fail_msg: >-
          パラメータシートの値を変換できません
          (状態=「{{ fw_enabled }}」, 受信=「{{ fw_inbound_action }}」,
          送信=「{{ fw_outbound_action }}」,
          規則プロファイル=「{{ fw_rule_profile }}」, 規則有効=「{{ fw_rule_enabled }}」)。
          指定できる値: 状態/有効={{ fw_state_map.keys() | list }},
          受信・送信={{ fw_action_map.keys() | list }},
          プロファイル={{ fw_profile_map.keys() | list }}

    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] 現在設定を取得"
      ansible.windows.win_shell: |
        $names = '{{ fw_profiles | to_json }}' | ConvertFrom-Json

        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            # Enabled は True/False/NotConfigured の列挙型
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })

        # グループ配下の受信規則（存在しない場合は空になる）
        $rules = @(Get-NetFirewallRule -Group '{{ fw_rule_group }}' -Direction Inbound -EA SilentlyContinue |
          ForEach-Object {
            [ordered]@{
              Name    = $_.Name
              Display = $_.DisplayName
              Enabled = ($_.Enabled.ToString() -eq 'True')
              # "Any" / "Domain, Private" のような文字列になる
              Profile = $_.Profile.ToString()
            }
          })

        [ordered]@{ Profiles = $profiles; Rules = $rules } | ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        fw_before: "{{ fw_before_raw.stdout | from_json }}"

    - name: "[BEFORE] 現在設定を表示"
      ansible.builtin.debug:
        var: fw_before

    # --- 変更が必要な対象を洗い出す ---
    - name: "[PLAN] 変更が必要なプロファイルと規則を確定"
      ansible.builtin.set_fact:
        fw_fix_profiles: >-
          {{ (fw_before.Profiles | rejectattr('Enabled', 'equalto', fw_enabled_val | bool)
              | map(attribute='Name') | list)
             | union(fw_before.Profiles | rejectattr('Inbound', 'equalto', fw_inbound_val)
                     | map(attribute='Name') | list)
             | union(fw_before.Profiles | rejectattr('Outbound', 'equalto', fw_outbound_val)
                     | map(attribute='Name') | list) }}
        fw_fix_rules: >-
          {{ (fw_before.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool)
              | map(attribute='Name') | list)
             | union(fw_before.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val)
                     | map(attribute='Name') | list) }}

    - name: "[PLAN] 処理内容を表示"
      ansible.builtin.debug:
        msg:
          - "変更するプロファイル : {{ fw_fix_profiles }}"
          - "変更する受信の規則   : {{ fw_fix_rules }}（グループ内 {{ fw_before.Rules | length }} 件中）"

    # 規則が1件も取得できない場合、グループ ID の誤りか OS 側に規則が無い。
    # 何も設定されないまま成功したように見えるのを防ぐため中止する。
    - name: "[GUARD] 対象の受信規則が存在するか検証"
      ansible.builtin.assert:
        that:
          - (fw_before.Rules | length) > 0
        success_msg: "対象の受信規則を {{ fw_before.Rules | length }} 件検出しました。"
        fail_msg: >-
          グループ {{ fw_rule_group }} の受信規則が1件も見つかりません。
          vars の fw_rule_group が正しいか確認してください。

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================
    - name: "ファイアウォールプロファイルを設定（状態・受信接続・送信接続）"
      ansible.windows.win_shell: |
        Set-NetFirewallProfile -Profile {{ fw_fix_profiles | join(',') }} `
          -Enabled {{ 'True' if (fw_enabled_val | bool) else 'False' }} `
          -DefaultInboundAction {{ fw_inbound_val }} `
          -DefaultOutboundAction {{ fw_outbound_val }}
      args:
        executable: powershell
      when: (fw_fix_profiles | length) > 0

    - name: "受信の規則（ファイルとプリンターの共有）を設定"
      ansible.windows.win_shell: |
        $names = '{{ fw_fix_rules | to_json }}' | ConvertFrom-Json
        Set-NetFirewallRule -Name $names `
          -Profile {{ fw_rule_profile_val }} `
          -Enabled {{ 'True' if (fw_rule_enabled_val | bool) else 'False' }}
      args:
        executable: powershell
      when: (fw_fix_rules | length) > 0

    - name: "[CHECK] 変更後も WinRM 接続が維持されているか確認"
      ansible.windows.win_ping:
      register: conn_check
      retries: 3
      delay: 10
      until: conn_check is succeeded

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] 設定を再取得"
      ansible.windows.win_shell: |
        $names = '{{ fw_profiles | to_json }}' | ConvertFrom-Json

        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })

        $rules = @(Get-NetFirewallRule -Group '{{ fw_rule_group }}' -Direction Inbound -EA SilentlyContinue |
          ForEach-Object {
            [ordered]@{
              Name    = $_.Name
              Display = $_.DisplayName
              Enabled = ($_.Enabled.ToString() -eq 'True')
              Profile = $_.Profile.ToString()
            }
          })

        [ordered]@{ Profiles = $profiles; Rules = $rules } | ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        fw_after: "{{ fw_after_raw.stdout | from_json }}"

    - name: "[AFTER] 変更後の設定を表示"
      ansible.builtin.debug:
        var: fw_after

    - name: "[AFTER] プロファイルが指定値どおりであることを確認"
      ansible.builtin.assert:
        that:
          - (item.Enabled | bool) == (fw_enabled_val | bool)
          - item.Inbound == fw_inbound_val
          - item.Outbound == fw_outbound_val
        success_msg: >-
          {{ item.Name }} : 状態={{ item.Enabled }}, 受信={{ item.Inbound }},
          送信={{ item.Outbound }} で一致しました。
        fail_msg: >-
          {{ item.Name }} : 一致しません
          (実際: 状態={{ item.Enabled }}, 受信={{ item.Inbound }}, 送信={{ item.Outbound }}
          / 期待: 状態={{ fw_enabled_val | bool }}, 受信={{ fw_inbound_val }},
          送信={{ fw_outbound_val }})。
      loop: "{{ fw_after.Profiles }}"
      loop_control:
        label: "{{ item.Name }}"

    - name: "[AFTER] 受信の規則が指定値どおりであることを確認"
      ansible.builtin.assert:
        that:
          - (fw_after.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool) | list | length) == 0
          - (fw_after.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val) | list | length) == 0
        success_msg: >-
          受信の規則 {{ fw_after.Rules | length }} 件すべてが
          プロファイル={{ fw_rule_profile_val }} / 有効={{ fw_rule_enabled_val | bool }} になりました。
        fail_msg: >-
          指定値と異なる規則があります:
          有効でない={{ fw_after.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool) | map(attribute='Name') | list }},
          プロファイル不一致={{ fw_after.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val) | map(attribute='Name') | list }}
