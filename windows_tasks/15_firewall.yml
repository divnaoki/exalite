---
# =====================================================================
# 15_Windows ファイアウォール設定
#
#   PHASE 0  パラメータシートの値を PowerShell の値に変換
#   PHASE 1  変更前の設定情報を取得
#   PHASE 2  現在値と異なる場合のみ変更を実行（冪等）
#   PHASE 3  変更後の設定情報を取得して確認
#
# 対象:
#   ・ドメイン / プライベート / パブリック 各プロファイルの
#     状態・受信接続・送信接続（プロファイルごとに変数を分けている）
#   ・vars で指定した受信の規則のプロファイルと有効化（規則名で個別指定）
#
# 設定値は vars/15_firewall.yml で定義。
# Exastro からは「有効（推奨）」「ブロック（既定）」のような日本語ラベルが渡るため、
# PHASE 0 で変換表を使い PowerShell の値（True / Block / Allow / Any）へ変換する。
# 列挙型はそのまま JSON 化すると数値になるため、PowerShell 側で文字列化している。
# =====================================================================
- name: "15_Windows ファイアウォール設定"
  hosts: windows
  gather_facts: false

  vars_files:
    - vars/15_firewall.yml

  tasks:
    # =================================================================
    # PHASE 0: パラメータシートの値を PowerShell の値に変換
    # =================================================================
    # 表記ゆれを吸収するため、空白・全角カッコ・「(既定)」「(推奨)」を除去し、
    # 英字は大文字化してから変換表（vars の *_map）と突き合わせる。
    - name: "[PREP] プロファイルごとの指定値を変換"
      ansible.builtin.set_fact:
        fw_targets: >-
          {{ fw_targets | default([]) + [ {
               'name': item.name,
               'label': item.label,
               'enabled': (fw_state_map[n[0]] | default('')),
               'inbound': (fw_action_map[n[1]] | default('')),
               'outbound': (fw_action_map[n[2]] | default('')),
               'raw': (item.enabled ~ ' / ' ~ item.inbound ~ ' / ' ~ item.outbound)
             } ] }}
      vars:
        n: >-
          {{ [item.enabled, item.inbound, item.outbound]
             | map('string') | map('trim')
             | map('replace', ' ', '') | map('replace', '　', '')
             | map('replace', '（', '(') | map('replace', '）', ')')
             | map('replace', '(既定)', '') | map('replace', '(推奨)', '')
             | map('upper') | list }}
      loop: "{{ fw_profile_settings }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "[PREP] 受信の規則の指定値を変換"
      ansible.builtin.set_fact:
        fw_rule_profile_val: "{{ fw_profile_map[r[0]] | default('') }}"
        fw_rule_enabled_val: "{{ fw_state_map[r[1]] | default('') }}"
      vars:
        r: >-
          {{ [fw_rule_profile, fw_rule_enabled]
             | map('string') | map('trim')
             | map('replace', ' ', '') | map('replace', '　', '')
             | map('replace', '（', '(') | map('replace', '）', ')')
             | map('replace', '(既定)', '') | map('replace', '(推奨)', '')
             | map('upper') | list }}

    - name: "[PREP] 変換結果を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item.label }} : 「{{ item.raw }}」 ->
          状態={{ item.enabled }}, 受信={{ item.inbound }}, 送信={{ item.outbound }}
      loop: "{{ fw_targets }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "[GUARD] プロファイルの指定値を変換できたか検証"
      ansible.builtin.assert:
        that:
          - item.enabled != ''
          - item.inbound != ''
          - item.outbound != ''
        success_msg: "{{ item.label }} : 変換できました。"
        fail_msg: >-
          {{ item.label }} : パラメータシートの値を変換できません（「{{ item.raw }}」）。
          指定できる値: 状態={{ fw_state_map.keys() | list }},
          受信・送信={{ fw_action_map.keys() | list }}
      loop: "{{ fw_targets }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "[GUARD] 受信の規則の指定値を変換できたか検証"
      ansible.builtin.assert:
        that:
          - fw_rule_profile_val != ''
          - fw_rule_enabled_val != ''
        success_msg: >-
          受信の規則 : プロファイル={{ fw_rule_profile_val }},
          有効={{ fw_rule_enabled_val }} に変換できました。
        fail_msg: >-
          受信の規則の値を変換できません
          (プロファイル=「{{ fw_rule_profile }}」, 有効=「{{ fw_rule_enabled }}」)。
          指定できる値: プロファイル={{ fw_profile_map.keys() | list }},
          有効={{ fw_state_map.keys() | list }}

    # =================================================================
    # PHASE 1: 変更前の設定情報を取得
    # =================================================================
    - name: "[BEFORE] 現在設定を取得"
      ansible.windows.win_shell: |
        $names = '{{ fw_targets | map(attribute="name") | list | to_json }}' | ConvertFrom-Json

        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            # Enabled は True/False/NotConfigured の列挙型
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })

        # 対象の受信規則（指定した規則名のみ。存在しないものは取得されない）
        $ruleNames = '{{ fw_rules | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $rules = @(Get-NetFirewallRule -Name $ruleNames -EA SilentlyContinue |
          ForEach-Object {
            [ordered]@{
              Name    = $_.Name
              Display = $_.DisplayName
              Enabled = ($_.Enabled.ToString() -eq 'True')
              # "Any" / "Domain, Private" のような文字列になる
              Profile = $_.Profile.ToString()
            }
          })
        # 存在しなかった規則（エラーにせずスキップし、最後に報告する）
        $missing = @($ruleNames | Where-Object { $rules.Name -notcontains $_ })

        [ordered]@{ Profiles = $profiles; Rules = $rules; MissingRules = $missing } |
          ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_before_raw

    - name: "[BEFORE] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        fw_before: "{{ fw_before_raw.stdout | from_json }}"

    - name: "[BEFORE] プロファイル名で引ける辞書を作成"
      ansible.builtin.set_fact:
        fw_before_map: >-
          {{ dict(fw_before.Profiles | map(attribute='Name') | zip(fw_before.Profiles)) }}

    - name: "[BEFORE] 現在設定を表示"
      ansible.builtin.debug:
        var: fw_before

    - name: "[BEFORE] プロファイルごとの現在値と指定値を表示"
      ansible.builtin.debug:
        msg: >-
          {{ item.label }} :
          状態 {{ fw_before_map[item.name].Enabled }} -> {{ item.enabled | bool }},
          受信 {{ fw_before_map[item.name].Inbound }} -> {{ item.inbound }},
          送信 {{ fw_before_map[item.name].Outbound }} -> {{ item.outbound }}
      loop: "{{ fw_targets }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "[PLAN] 変更が必要な受信の規則を確定"
      ansible.builtin.set_fact:
        fw_fix_rules: >-
          {{ (fw_before.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool)
              | map(attribute='Name') | list)
             | union(fw_before.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val)
                     | map(attribute='Name') | list) }}

    - name: "[PLAN] 変更する受信の規則を表示"
      ansible.builtin.debug:
        msg:
          - "変更する受信の規則 : {{ fw_fix_rules }}"
          - "対象として検出した規則 : {{ fw_before.Rules | map(attribute='Display') | list }}"

    # 指定した規則が1件も取得できない場合、規則名の誤りか OS 側に規則が無い。
    # 何も設定されないまま成功したように見えるのを防ぐため中止する。
    - name: "[GUARD] 対象の受信規則が存在するか検証"
      ansible.builtin.assert:
        that:
          - (fw_before.Rules | length) > 0
        success_msg: "対象の受信規則を {{ fw_before.Rules | length }} 件検出しました。"
        fail_msg: >-
          指定した受信規則が1件も見つかりません（{{ fw_rules | map(attribute='name') | list }}）。
          vars の fw_rules の規則名が正しいか確認してください。

    # =================================================================
    # PHASE 2: 変更（現在値と異なる場合のみ実行）
    # =================================================================
    - name: "ファイアウォールプロファイルを設定（状態・受信接続・送信接続）"
      ansible.windows.win_shell: |
        Set-NetFirewallProfile -Profile {{ item.name }} `
          -Enabled {{ 'True' if (item.enabled | bool) else 'False' }} `
          -DefaultInboundAction {{ item.inbound }} `
          -DefaultOutboundAction {{ item.outbound }}
      args:
        executable: powershell
      loop: "{{ fw_targets }}"
      loop_control:
        label: "{{ item.label }}"
      when: >-
        (fw_before_map[item.name].Enabled | bool) != (item.enabled | bool)
        or fw_before_map[item.name].Inbound != item.inbound
        or fw_before_map[item.name].Outbound != item.outbound

    - name: "受信の規則を設定（プロファイル・有効）"
      ansible.windows.win_shell: |
        $names = '{{ fw_fix_rules | to_json }}' | ConvertFrom-Json
        Set-NetFirewallRule -Name $names `
          -Profile {{ fw_rule_profile_val }} `
          -Enabled {{ 'True' if (fw_rule_enabled_val | bool) else 'False' }}
      args:
        executable: powershell
      when: (fw_fix_rules | length) > 0

    - name: "[CHECK] 変更後も WinRM 接続が維持されているか確認"
      ansible.windows.win_ping:
      register: conn_check
      retries: 3
      delay: 10
      until: conn_check is succeeded

    # =================================================================
    # PHASE 3: 変更後の設定情報を取得（確認）
    # =================================================================
    - name: "[AFTER] 設定を再取得"
      ansible.windows.win_shell: |
        $names = '{{ fw_targets | map(attribute="name") | list | to_json }}' | ConvertFrom-Json

        $profiles = @(Get-NetFirewallProfile -Profile $names | ForEach-Object {
          [ordered]@{
            Name     = $_.Name
            Enabled  = ($_.Enabled.ToString() -eq 'True')
            Inbound  = $_.DefaultInboundAction.ToString()
            Outbound = $_.DefaultOutboundAction.ToString()
          }
        })

        $ruleNames = '{{ fw_rules | map(attribute="name") | list | to_json }}' | ConvertFrom-Json
        $rules = @(Get-NetFirewallRule -Name $ruleNames -EA SilentlyContinue |
          ForEach-Object {
            [ordered]@{
              Name    = $_.Name
              Display = $_.DisplayName
              Enabled = ($_.Enabled.ToString() -eq 'True')
              Profile = $_.Profile.ToString()
            }
          })
        $missing = @($ruleNames | Where-Object { $rules.Name -notcontains $_ })

        [ordered]@{ Profiles = $profiles; Rules = $rules; MissingRules = $missing } |
          ConvertTo-Json -Compress -Depth 4
      args:
        executable: powershell
      changed_when: false
      register: fw_after_raw

    - name: "[AFTER] 取得結果を変数に格納"
      ansible.builtin.set_fact:
        fw_after: "{{ fw_after_raw.stdout | from_json }}"

    - name: "[AFTER] プロファイル名で引ける辞書を作成"
      ansible.builtin.set_fact:
        fw_after_map: >-
          {{ dict(fw_after.Profiles | map(attribute='Name') | zip(fw_after.Profiles)) }}

    - name: "[AFTER] 変更後の設定を表示"
      ansible.builtin.debug:
        var: fw_after

    - name: "[AFTER] プロファイルが指定値どおりであることを確認"
      ansible.builtin.assert:
        that:
          - (fw_after_map[item.name].Enabled | bool) == (item.enabled | bool)
          - fw_after_map[item.name].Inbound == item.inbound
          - fw_after_map[item.name].Outbound == item.outbound
        success_msg: >-
          {{ item.label }} : 状態={{ fw_after_map[item.name].Enabled }},
          受信={{ fw_after_map[item.name].Inbound }},
          送信={{ fw_after_map[item.name].Outbound }} で一致しました。
        fail_msg: >-
          {{ item.label }} : 一致しません
          (実際: 状態={{ fw_after_map[item.name].Enabled }},
          受信={{ fw_after_map[item.name].Inbound }},
          送信={{ fw_after_map[item.name].Outbound }}
          / 期待: 状態={{ item.enabled | bool }}, 受信={{ item.inbound }},
          送信={{ item.outbound }})。
      loop: "{{ fw_targets }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "[AFTER] 受信の規則が指定値どおりであることを確認"
      ansible.builtin.assert:
        that:
          - (fw_after.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool) | list | length) == 0
          - (fw_after.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val) | list | length) == 0
        success_msg: >-
          受信の規則 {{ fw_after.Rules | length }} 件すべてが
          プロファイル={{ fw_rule_profile_val }} / 有効={{ fw_rule_enabled_val | bool }} になりました。
        fail_msg: >-
          指定値と異なる規則があります:
          有効でない={{ fw_after.Rules | rejectattr('Enabled', 'equalto', fw_rule_enabled_val | bool) | map(attribute='Name') | list }},
          プロファイル不一致={{ fw_after.Rules | rejectattr('Profile', 'equalto', fw_rule_profile_val) | map(attribute='Name') | list }}

    - name: "[AFTER] 存在しなかった受信の規則を報告"
      ansible.builtin.debug:
        msg: "対象サーバーに存在しないためスキップした規則: {{ fw_after.MissingRules }}"
      when: (fw_after.MissingRules | length) > 0
