---
# 08_サーバーの役割と機能 : Ansibleタスク
# 自動生成: グループ内で内容が完全一致するタスクは重複排除済み

- name: Windows機能「Storage-Services」を追加
  ansible.windows.win_feature:
    name: Storage-Services
    state: present
    include_management_tools: yes

